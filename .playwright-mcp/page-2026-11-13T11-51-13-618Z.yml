            - heading [level=3] [ref=e384]:
              - button "Faut-il poser le parquet dans le sens de la lumière ou perpendiculairement à la fenêtre ?" [expanded] [ref=e385] [cursor=pointer]
            - generic [ref=e389]:
              - paragraph [ref=e390]: "Les deux formulations décrivent le même geste, ce qui explique la confusion fréquente. Les rayons entrent perpendiculairement au plan de la fenêtre : poser « dans le sens de la lumière » revient donc à orienter les lames perpendiculairement au mur qui porte la fenêtre. Les joints filent alors dans l’axe des rayons et se remarquent beaucoup moins."
              - paragraph [ref=e391]:
                - link "Le guide complet du sens de pose" [ref=e392] [cursor=pointer]:
                  - /url: guides/quel-sens-de-pose-choisir/
          - generic [ref=e395]:
            - heading [level=3] [ref=e396]:
              - button "Dans quel sens poser un parquet dans un couloir ?" [ref=e397] [cursor=pointer]
            - paragraph [ref=e400]: "Dans la longueur, parallèlement aux murs. Une pose en travers multiplie les coupes, hache visuellement le passage et raccourcit l’espace. C’est le seul cas courant où la géométrie prime sur la lumière : un couloir se pose dans son axe, même si la fenêtre se trouve à son extrémité."
          - generic [ref=e401]:
            - heading [level=3] [ref=e402]:
              - button "Quelle est la différence entre bâton rompu et point de Hongrie ?" [ref=e403] [cursor=pointer]
            - generic:
              - generic:
                - paragraph [ref=e406]: "Le bâton rompu assemble des lames à bouts droits, posées perpendiculairement les unes aux autres : les extrémités se décalent et forment un zigzag. Le point de Hongrie utilise des lames coupées en biais qui se rejoignent bout à bout en une pointe continue. Il exige des lames gauches et droites, en quantités égales."
                - paragraph [ref=e407]:
                  - link "Les 6 motifs de pose" [ref=e408] [cursor=pointer]:
                    - /url: motifs/
          - generic [ref=e411]:
            - heading [level=3] [ref=e412]:
              - button "Combien de chutes faut-il prévoir ?" [ref=e413] [cursor=pointer]
            - paragraph [ref=e416]: "Comptez de l’ordre de 5 % en pose droite et 10 à 15 % en diagonale ou en point de Hongrie, ces motifs multipliant les coupes d’angle en périphérie. Prévoyez la marge au moment de la commande : un complément acheté plus tard peut provenir d’un autre bain de teinte."
          - generic [ref=e417]:
            - heading [level=3] [ref=e418]:
              - button "Peut-on poser du parquet sur du carrelage ?" [ref=e419] [cursor=pointer]
            - generic:
              - generic:
                - paragraph [ref=e422]: "En pose flottante, c’est généralement possible si le carrelage est sain, adhérent et suffisamment plan. Contrôlez la planéité à la règle de deux mètres et vérifiez la hauteur disponible sous les portes et aux seuils : c’est le point qui bloque le plus souvent le projet, pas le support lui-même."
                - paragraph [ref=e423]:
