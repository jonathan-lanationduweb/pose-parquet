name: Déployer sur GitHub Pages

# Le site est statique et servi tel quel depuis la racine du dépôt.
# Ce workflow ne s'exécute qu'une fois GitHub Pages activé sur le dépôt
# (Settings → Pages → Source : GitHub Actions).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        run: |
          rm -rf _site
          mkdir _site
          # On copie le site sans les sources du générateur ni le dossier git
          rsync -a --exclude '.git' --exclude '_generator' --exclude '.github' \
                --exclude 'serve.js' --exclude '_site' ./ _site/
          touch _site/.nojekyll

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
