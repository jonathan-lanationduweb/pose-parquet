name: Déployer sur GitHub Pages

# Le site est statique et servi tel quel depuis la racine du dépôt.
# Ce workflow ne s'exécute qu'une fois GitHub Pages activé sur le dépôt
# (Settings → Pages → Source : GitHub Actions).
#
# DEUX VARIABLES DE DÉPÔT pilotent ce déploiement
# (Settings → Secrets and variables → Actions → Variables) :
#
#   SITE_ENVIRONMENT   'production' ou 'staging'. Absente = staging.
#   API_BASE_URL       racine REST du backend, ex.
#                      https://admin.pose-parquet.com/wp-json/pose-parquet/v1
#                      Absente = le formulaire affiche son indisponibilité.
#
# Aucune des deux n'est un secret : ce sont des adresses publiques. Elles sont
# des VARIABLES et non des valeurs écrites dans le dépôt parce qu'elles
# décrivent un environnement, pas le produit — et parce qu'un environnement
# doit pouvoir changer sans relecture de code.

on:
  push:
    branches: [main]
  workflow_dispatch:
  # « Publier le site » dans WordPress (Pose Parquet → Publication), en
  # production : le plugin envoie un repository_dispatch avec un jeton qui ne
  # quitte jamais le serveur WordPress (wp-config.php). Voir
  # docs/backend/publication-wordpress.md.
  repository_dispatch:
    types: [wordpress-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    env:
      # Défaut sûr : en l'absence de déclaration, on est en préproduction et on
      # n'indexe pas. Se tromper dans ce sens coûte un référencement retardé ;
      # se tromper dans l'autre met en ligne une préproduction indexée, et
      # désindexer prend des semaines.
      SITE_ENVIRONMENT: ${{ vars.SITE_ENVIRONMENT || 'staging' }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      # Export public des contenus WordPress publiés, ex.
      # https://admin.pose-parquet.com/wp-json/pose-parquet/v1/contenus
      # Absente = le site est publié tel qu'il est dans le dépôt.
      WP_EXPORT_URL: ${{ vars.WP_EXPORT_URL }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      # WordPress est la source éditoriale : quand son export est déclaré, le
      # site est reconstruit à partir de lui à CHAQUE déploiement (push comme
      # publication depuis WordPress) — sinon un push republierait l'ancien
      # instantané du dépôt. `contenus.js` valide l'export avant d'écrire quoi
      # que ce soit : une erreur structurante fait échouer le job ICI, avant
      # tout artefact, et le site en ligne reste celui d'avant.
      - name: Installer Node
        if: env.WP_EXPORT_URL != ''
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tirer le contenu WordPress, valider, construire
        if: env.WP_EXPORT_URL != ''
        env:
          # Le générateur écrit dans SITE_ROOT : le dépôt extrait ici.
          SITE_ROOT: ${{ github.workspace }}
        run: node _generator/contenus.js "$WP_EXPORT_URL"

      - name: Préparer l'artefact
        run: |
          rm -rf _site
          mkdir _site
          # Ce qui est publié est le SITE, et rien d'autre.
          #
          # `.kilo/` n'a jamais pu suivre — c'est un arbre de travail Git, que
          # `checkout` ne restitue pas. Il est exclu et contrôlé quand même :
          # une exclusion ne coûte rien, et un artefact fabriqué ailleurs qu'ici
          # (rsync depuis un poste, par exemple) emporterait 35 Mo d'une vieille
          # copie du site.
          #
          # Étaient publiés jusqu'ici, sans que ce soit voulu : docs/ (348 Ko de
          # documentation interne, dont l'architecture de sécurité et les seuils
          # d'anti-spam), design/, .claude/, .vscode/ et le README. Aucune page
          # du site ne renvoie vers l'un d'eux — vérifié — et aucun n'a de
          # raison d'être lisible publiquement.
          #
          # S'y ajoutent js/, css/ et components/ : ce sont les SOURCES du
          # build, 928 Ko, et aucune page servie ne les demande. Les pages
          # chargent assets/dist/ — un arbre complet où le générateur a recopié
          # ces mêmes fichiers sous une empreinte de contenu. Vérifié le
          # 14/09/2026 : dans le HTML publié, zéro src/href vers js/ ou css/, et
          # la seule référence à components/ vient de
          # components/project-form/project-form.html, page d'aperçu interne qui
          # n'est ni liée ni au sitemap. Dans le JS distribué, les imports
          # « ../../js/… » et « ./components/… » sont relatifs et résolvent À
          # L'INTÉRIEUR de assets/dist/ : ils ne sortent jamais de l'arbre.
          #
          # Ce qui reste, et pourquoi :
          #   assets/   dist (pages, JS, CSS), fonts (url() des @font-face), images, icônes
          #   data/     lu à l'exécution : catalogue, scènes, familles de rendu
          #   config.js adresse du backend, réécrit plus bas au déploiement
          rsync -a \
                --exclude '.git' \
                --exclude '.gitattributes' \
                --exclude '.gitignore' \
                --exclude '.github' \
                --exclude '.claude' \
                --exclude '.vscode' \
                --exclude '.kilo' \
                --exclude '_generator' \
                --exclude '_calibrage' \
                --exclude '_site' \
                --exclude 'backend' \
                --exclude 'docs' \
                --exclude 'design' \
                --exclude 'node_modules' \
                --exclude 'serve.js' \
                --exclude '.*.tmp' \
                --exclude 'README.md' \
                --exclude 'CREDITS.md' \
                --exclude '/js' \
                --exclude '/css' \
                --exclude '/components' \
                ./ _site/
          touch _site/.nojekyll

      - name: Vérifier que rien d'interne n'a suivi
        run: |
          # Une exclusion oubliée ne doit pas se découvrir en production.
          fuites=0

          # Temporaires de l'ecriture atomique du generateur : retires apres
          # chaque ecriture, mais une construction interrompue peut en laisser
          # un, et cela n'a rien a faire dans un artefact public.
          temporaires=$(find _site -name '.*.tmp' | head -5)
          if [ -n "$temporaires" ]; then
            echo "::error::des fichiers temporaires du generateur sont dans l'artefact :"
            echo "$temporaires"
            fuites=1
          fi

          for interdit in docs design backend _generator _calibrage .claude .vscode .kilo README.md js css components; do
            if [ -e "_site/$interdit" ]; then
              echo "::error::_site/$interdit ne devrait pas être publié"
              fuites=$((fuites + 1))
            fi
          done
          [ "$fuites" -eq 0 ] || exit 1
          # L'arbre distribué, lui, DOIT contenir son js — c'est ce que les
          # pages chargent. Une exclusion trop large le briserait en silence.
          ls _site/assets/dist/*/js/main.js >/dev/null 2>&1 \
            || { echo "::error::assets/dist/<empreinte>/js/main.js absent : l'exclusion a mordu sur l'arbre distribué"; exit 1; }
          echo "Artefact : $(find _site -type f | wc -l) fichiers, $(du -sh _site | cut -f1)"

      # Retirer des fichiers d'un artefact demande une preuve, pas une
      # intuition : on relit chaque page publiée et on vérifie que TOUT ce
      # qu'elle référence existe réellement dans l'artefact. Le contrôle ne
      # porte pas seulement sur les trois dossiers retirés — il attrape
      # n'importe quelle ressource manquante, d'où qu'elle vienne.
      - name: Vérifier qu'aucune ressource référencée ne manque
        run: |
          python3 - <<'PY'
          import os, re, sys
          from urllib.parse import urlparse, unquote

          RACINE = "_site"
          motif = re.compile(r'(?:src|href)\s*=\s*"([^"]+)"')
          manquants, controlees = [], 0

          for dossier, _, fichiers in os.walk(RACINE):
              for nom in fichiers:
                  if not nom.endswith(".html"):
                      continue
                  chemin = os.path.join(dossier, nom)
                  with open(chemin, encoding="utf-8") as f:
                      html = f.read()
                  for brut in motif.findall(html):
                      u = urlparse(brut)
                      # Externe, ancre, mailto, data: — hors de notre ressort.
                      if u.scheme or brut.startswith(("#", "//", "mailto:", "tel:")):
                          continue
                      cible = unquote(u.path)
                      if not cible:
                          continue
                      base = RACINE if cible.startswith("/") else dossier
                      resolu = os.path.normpath(os.path.join(base, cible.lstrip("/")))
                      controlees += 1
                      # Un chemin en dossier vaut son index.html.
                      if os.path.isdir(resolu):
                          resolu = os.path.join(resolu, "index.html")
                      if not os.path.exists(resolu):
                          manquants.append(f"{chemin} -> {brut}")

          print(f"{controlees} références contrôlées dans l'artefact.")
          if manquants:
              print(f"::error::{len(manquants)} ressource(s) référencée(s) mais absente(s) de l'artefact :")
              for m in manquants[:40]:
                  print("  " + m)
              sys.exit(1)
          print("Aucune ressource manquante.")
          PY

      # Adresse du backend.
      #
      # Un seul fichier est réécrit, et il ne contient que de la configuration.
      # Le code métier (js/forms/api-config.js) n'est jamais touché par un
      # déploiement : il lit window.POSE_PARQUET_CONFIG, que ce fichier pose.
      - name: Brancher l'API si une adresse est déclarée
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Aucune variable API_BASE_URL : le formulaire projet affichera son indisponibilité."
            exit 0
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL doit être en HTTPS (reçu : $API_BASE_URL)"; exit 1 ;;
          esac
          cat > _site/config.js <<EOF
          /* Écrit par le déploiement — voir .github/workflows/deploy-pages.yml. */
          window.POSE_PARQUET_CONFIG = window.POSE_PARQUET_CONFIG || {};
          window.POSE_PARQUET_CONFIG.apiBaseUrl = "$API_BASE_URL";
          EOF
          echo "API branchée sur $API_BASE_URL"
          grep -q 'apiBaseUrl' _site/config.js || { echo "::error::config.js non écrit"; exit 1; }

      # Les fichiers du dépôt décrivent toujours la PRODUCTION : canoniques en
      # pose-parquet.com, robots en « index, follow », sitemap complet. C'est
      # volontaire — un noindex écrit dans les sources finirait tôt ou tard
      # copié en production le jour de la mise en ligne.
      #
      # C'est donc le déploiement qui marque une préproduction. Le signal était
      # jusqu'ici la PRÉSENCE D'UN FICHIER CNAME, ce qui mélangeait deux choses
      # sans rapport : « ce site a un nom de domaine » et « ce site est la
      # production ». Un domaine peut être posé sur une préproduction, et une
      # production peut tourner un temps sans domaine. Le signal est désormais
      # déclaré, et le CNAME n'est plus qu'un contrôle de cohérence.
      #
      # Voir docs/seo-environnements.md.
      - name: Marquer la préproduction (noindex)
        if: ${{ vars.SITE_ENVIRONMENT != 'production' }}
        run: |
          echo "SITE_ENVIRONMENT=$SITE_ENVIRONMENT : déploiement traité comme une préproduction."
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          rm -f _site/sitemap.xml
          find _site -name '*.html' -print0 | xargs -0 --no-run-if-empty sed -i -E \
            's#<meta name="robots" content="[^"]*" />#<meta name="robots" content="noindex, nofollow" />#'

          # Contrôle réel de la balise, et non du texte.
          #
          # L'ancien contrôle comptait les fichiers contenant la chaîne
          # « noindex, nofollow » n'importe où. Or le gabarit porte un
          # commentaire HTML qui contient exactement ces mots : le compte était
          # donc toujours égal au nombre de pages, que le sed ait fonctionné ou
          # non. Une preuve qui ne peut pas échouer ne prouve rien. On compte
          # désormais la BALISE, et on échoue s'il en manque une seule.
          total=$(find _site -name '*.html' | wc -l)
          marquees=$(grep -rlF '<meta name="robots" content="noindex, nofollow" />' _site --include='*.html' | wc -l)
          echo "Pages : $marquees / $total portent la balise noindex."
          if [ "$marquees" -ne "$total" ]; then
            echo "::error::$((total - marquees)) page(s) ne sont pas en noindex :"
            grep -rLF '<meta name="robots" content="noindex, nofollow" />' _site --include='*.html'
            exit 1
          fi
          grep -q 'Disallow: /' _site/robots.txt || { echo "::error::robots.txt non marqué"; exit 1; }
          [ ! -f _site/sitemap.xml ] || { echo "::error::sitemap.xml toujours présent"; exit 1; }

      - name: Confirmer la production (index)
        if: ${{ vars.SITE_ENVIRONMENT == 'production' }}
        run: |
          echo "SITE_ENVIRONMENT=production : déploiement traité comme la production."
          if [ ! -f CNAME ]; then
            echo "::warning::SITE_ENVIRONMENT vaut production mais aucun CNAME n'est présent : le site sera servi sur *.github.io avec des canoniques pointant ailleurs."
          fi
          grep -qF '<meta name="robots" content="index, follow" />' _site/index.html \
            || { echo "::error::L'accueil n'est pas indexable — vérifier _generator/layout.js"; exit 1; }
          # La 404 ne doit jamais être indexable, même en production.
          grep -qF '<meta name="robots" content="noindex' _site/404.html \
            || { echo "::error::404.html doit être en noindex"; exit 1; }
          [ -f _site/sitemap.xml ] || { echo "::error::sitemap.xml absent en production"; exit 1; }
          echo "Accueil indexable, 404 non indexable, sitemap présent : OK"

      - name: Téléverser l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
