# ==========================================================================
# Pose Parquet — durcissement du WordPress d'administration, version nginx.
#
# Équivalent de htaccess-hardening.conf pour un hébergement nginx, où les
# fichiers .htaccess sont ignorés. À inclure dans le bloc `server { … }` du
# WordPress distant, AVANT le bloc `location ~ \.php$` :
#
#     include /chemin/vers/nginx-hardening.conf;
#
# Rien ici ne touche à l'administration, à la connexion ni à l'API REST.
# Vérifier après chaque changement : `nginx -t`, puis
# `php backend/deploy/verifier-production.php https://<wordpress>`.
# ==========================================================================

# Pas de liste de fichiers d'un dossier.
autoindex off;

# Fichiers cachés (.git, .env, .htaccess…), sauf la validation de certificat.
location ~ /\.(?!well-known/) {
    deny all;
}

# Fichiers d'installation et de documentation de WordPress.
location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php)$ {
    deny all;
}
location ~* ^/wp-admin/install.*\.php$ {
    deny all;
}

# Sauvegardes, journaux, exports de base.
location ~* \.(bak|log|sql|old|orig|save|swp|swo|tmp|dist)$ {
    deny all;
}

# Fichiers de développement embarqués par une extension ou un thème.
location ~* \.(md|markdown|lock|neon|po|pot)$ {
    deny all;
}
location ~* /(composer\.json|package\.json|package-lock\.json|phpunit\.xml.*|phpcs\.xml.*|phpstan\.neon.*|Makefile|Gruntfile\.js|gulpfile\.js|webpack\.config\.js)$ {
    deny all;
}

# XML-RPC : désactivé par le plugin, fermé ici aussi.
location = /xmlrpc.php {
    deny all;
}

# Tests, outils et dépendances d'une extension ou d'un thème : jamais sur le web.
location ~* ^/wp-content/(plugins|themes|mu-plugins)/[^/]+/(tests?|bin|tools|node_modules|vendor/bin|\.github|\.git)(/|$) {
    deny all;
}

# Aucun PHP n'est exécuté depuis les téléversements.
location ~* ^/wp-content/uploads/.*\.(php|phtml|php[0-9])$ {
    deny all;
}

# État de la publication locale (pp-publication) : jamais lisible sur le web.
# Sous Apache, un .htaccess posé par le plugin s'en charge ; nginx l'ignore.
location ^~ /wp-content/pp-publication/ {
    deny all;
}
