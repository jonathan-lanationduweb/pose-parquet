# =============================================================================
# Pose Parquet — durcissement serveur du WordPress backend
# =============================================================================
#
# Ce fichier est la référence versionnée des règles Apache à poser sur le
# WordPress qui héberge le plugin métier. Il n'est appliqué nulle part
# automatiquement : il se copie dans le .htaccess du site, AU-DESSUS du bloc
# « # BEGIN WordPress », que WordPress réécrit quand on change les permaliens.
# Tout ce qui est placé à l'intérieur de ce bloc finit par disparaître.
#
# Ce que ces règles couvrent, et pourquoi il faut Apache pour le faire : ce
# sont des fichiers réels sur le disque. Une extension PHP ne peut rien contre
# une requête qui n'atteint jamais PHP. Ce que PHP peut faire — énumération
# des utilisateurs par l'API REST, XML-RPC, archives d'auteur — est traité
# dans le plugin, par src/Security/Hardening.php.
#
# Relevé du 14/09/2026 sur l'installation locale, avant application :
#
#   /wp-content/debug.log                        200   265 136 octets
#   /readme.html                                 200     7 406 octets
#   /license.txt                                 200    19 903 octets
#   /wp-config.php.avant-pose-parquet-dev.bak    200   exécuté comme PHP
#   /install-dev.php                             200   crée un compte admin
#
# La quatrième ligne mérite un mot. Sur ce serveur, Apache a EXÉCUTÉ la
# sauvegarde de wp-config au lieu d'en servir la source — d'où une réponse
# vide et pas une fuite d'identifiants. C'est un hasard de configuration du
# gestionnaire PHP, pas une protection : le même fichier sur un serveur
# ordinaire rend le mot de passe de la base en clair. Une sauvegarde de
# wp-config n'a rien à faire sous la racine web, sur aucun serveur.
#
# -----------------------------------------------------------------------------
# Pour nginx, l'équivalent se trouve dans nginx-hardening.conf.
# -----------------------------------------------------------------------------

# BEGIN Pose Parquet durcissement

# Pas de listage de dossier : un dossier sans index ne doit pas rendre son
# inventaire. WAMP active +Indexes par défaut dans le VirtualHost.
Options -Indexes

<IfModule mod_authz_core.c>

    # Fichiers d'identité de WordPress : sa version exacte, donc la liste des
    # failles publiées qui s'y appliquent. Rien ne les lit à part un scanner.
    <FilesMatch "^(readme\.html|license\.txt|wp-config-sample\.php)$">
        Require all denied
    </FilesMatch>

    # Sauvegardes, journaux, exports, fichiers d'éditeur. Un .bak de wp-config
    # est un fichier de mots de passe qui attend le bon serveur pour le dire.
    <FilesMatch "\.(bak|log|sql|old|orig|save|swp|swo|tmp|dist)$">
        Require all denied
    </FilesMatch>

    # Fichiers cachés (.env, .git/, .user.ini) : jamais servis.
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # XML-RPC. Le plugin le désactive déjà côté PHP ; le fermer ici évite en
    # plus le coût d'un chargement complet de WordPress à chaque tentative de
    # force brute, qui est l'usage réel de ce point d'entrée aujourd'hui.
    <Files "xmlrpc.php">
        Require all denied
    </Files>

    # Scripts d'amorçage laissés sur place. install-dev.php appelle wp_install()
    # avec un mot de passe écrit dans le fichier : sur une base vide, l'ouvrir
    # dans un navigateur crée un administrateur dont le mot de passe est connu.
    # La bonne fin de vie de ce fichier est la suppression ; cette règle le tient
    # fermé en attendant.
    <FilesMatch "^install-.*\.php$">
        Require all denied
    </FilesMatch>

    # Documentation et fichiers d'outillage embarqués dans une extension.
    #
    # Relevé du 28/09/2026, avant application :
    #
    #   /wp-content/plugins/pose-parquet-core/readme.md   200   11 422 octets
    #
    # Onze kilo-octets décrivant l'architecture du plugin, ses versions, ses
    # routes et le fonctionnement de son anti-spam. Rien de secret pris
    # isolément ; une carte du terrain servie à qui la demande.
    #
    # La vraie réponse est de ne pas livrer ces fichiers — voir
    # backend/deploy/faire-paquet.sh, qui construit un paquet sans eux. Cette
    # règle est la seconde barrière : elle vaut aussi pour les extensions
    # tierces, qui embarquent presque toutes leur README et leur changelog.
    <FilesMatch "\.(md|markdown|lock|neon|dist|po|pot|babelrc|eslintrc.*|prettierrc.*|editorconfig|gitattributes)$">
        Require all denied
    </FilesMatch>

    # Fichiers de configuration d'outils, à la racine d'une extension.
    <FilesMatch "^(composer\.json|package\.json|package-lock\.json|phpunit\.xml.*|phpcs\.xml.*|phpstan\.neon.*|Makefile|Gruntfile\.js|gulpfile\.js|webpack\.config\.js)$">
        Require all denied
    </FilesMatch>

</IfModule>

# Dossiers de travail d'une extension ou d'un thème : tests, outils, scripts,
# dépendances de développement.
#
# Relevé du 28/09/2026, avant application — les six scripts de test du plugin
# répondaient 200 ET ÉTAIENT EXÉCUTÉS :
#
#   /wp-content/plugins/pose-parquet-core/tests/run-http.php   200   1 395 octets
#
# La réponse contenait une erreur fatale PHP affichant le chemin absolu
# complet du serveur. Le script lui-même est inoffensif — il attend un
# argument de ligne de commande et s'arrête —, mais un script de test n'a
# aucune raison d'être atteignable, et le prochain le sera peut-être moins.
#
# `<FilesMatch>` ne sait pas viser un dossier et `<DirectoryMatch>` est
# interdit en .htaccess : c'est donc mod_rewrite qui ferme le chemin.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^wp-content/(plugins|themes|mu-plugins)/[^/]+/(tests?|bin|tools|node_modules|vendor/bin|\.github|\.git)(/|$) - [F,L,NC]
</IfModule>

# Les fichiers PHP de wp-content ne sont jamais des points d'entrée légitimes :
# les extensions sont appelées par WordPress, pas par URL. C'est la règle qui
# transforme un téléversement malveillant en fichier inerte.
#
# Deux exceptions réelles et connues, laissées ouvertes : certaines extensions
# servent des ressources par un PHP dédié. Vérifier avant d'activer ce bloc sur
# un site qui aurait plus d'une extension ; ici il n'y en a qu'une, la nôtre,
# et elle n'expose aucun point d'entrée direct.
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteRule ^wp-content/uploads/.*\.(php|phtml|php[0-9])$ - [F,L,NC]
</IfModule>

# END Pose Parquet durcissement
