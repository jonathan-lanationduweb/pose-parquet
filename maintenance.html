<meta charset="utf-8" />

<title>Le site revient bientôt. — Pose Parquet</title>
<style>
@font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: swap; src: url("assets/fonts/instrument-serif-400-3.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-style: normal; font-weight: 100 900; font-display: swap; src: url("assets/fonts/inter-var-1.woff2") format("woff2"); }
/*
 * Page de maintenance — une seule feuille, deux lecteurs :
 *   - WordPress (templates/maintenance-page.php) l'insère telle quelle ;
 *   - le générateur du site statique (_generator/wordpress.js) aussi.
 * Les @font-face sont déclarées par chacun (chemins différents) ; ici, rien
 * que la mise en page. Une image pleine hauteur, le logo, un titre, un texte,
 * deux liens. Ni compte à rebours, ni animation, ni formulaire.
 */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: #fff;
  background: #2b2621;
}
.pm {
  position: relative;
  min-height: 100vh;
  min-height: 100svh;
  display: grid;
  grid-template-rows: auto 1fr;
  padding: clamp(1.5rem, 1rem + 2.5vw, 3.5rem);
  background-color: #6b5745;
  background-size: cover;
  background-position: center;
  isolation: isolate;
}
.pm::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(100deg, rgba(38, 30, 23, 0.72) 0%, rgba(38, 30, 23, 0.42) 55%, rgba(38, 30, 23, 0.18) 100%);
}
.pm__marque {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  font-family: "Instrument Serif", Georgia, serif;
  font-size: clamp(1.35rem, 1.1rem + 0.8vw, 1.75rem);
  letter-spacing: -0.01em;
  color: #fff;
  text-decoration: none;
}
.pm__marque svg { width: 0.62em; height: 1.15em; }
.pm__marque span { opacity: 0.72; }
.pm__corps { align-self: center; max-width: 34rem; display: grid; gap: 1.25rem; padding: 2rem 0; }
.pm__titre {
  margin: 0;
  font-family: "Instrument Serif", Georgia, serif;
  font-weight: 400;
  font-size: clamp(2.6rem, 1.6rem + 4.2vw, 4.75rem);
  line-height: 1;
  letter-spacing: -0.02em;
}
.pm__texte { margin: 0; max-width: 32rem; font-size: clamp(0.95rem, 0.9rem + 0.25vw, 1.08rem); line-height: 1.6; color: rgba(255, 255, 255, 0.84); }
.pm__liens { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
.pm__lien {
  display: grid;
  gap: 0.1rem;
  min-width: 12.5rem;
  padding: 0.85rem 1.4rem;
  border-radius: 999px;
  text-align: center;
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
}
.pm__lien small { font-size: 0.74rem; font-weight: 400; opacity: 0.85; }
.pm__lien--clair { background: #f4f2ec; color: #16181a; }
.pm__lien--sombre { background: #4a5a46; color: #fff; }
.pm__lien:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
@media (max-width: 30rem) {
  .pm__liens { flex-direction: column; }
  .pm__lien { width: 100%; }
}
</style>
</head>
<body>
<main class="pm" style="background-image:url('assets/images/room-piece-arcades.jpg')">
  <span class="pm__marque" aria-label="Pose Parquet"><svg viewBox="0 0 106 197" fill="currentColor" aria-hidden="true"><g transform="scale(106 197)"><path d="M0 0H0.3396V0.5584L0 0.6396ZM0 0.6599L0.3396 0.5787V1H0ZM0.4057 0H0.7453V0.2437L0.4057 0.3249ZM0.4057 0.3452L0.7453 0.264V1H0.4057ZM0.8208 0H1V0.5584L0.8208 0.6012ZM0.8208 0.6215L1 0.5787V1H0.8208Z"/></g></svg>Pose <span>Parquet</span></span>
  <div class="pm__corps">
    <h1 class="pm__titre">Le site revient bientôt.</h1>
    <p class="pm__texte">Nous effectuons actuellement une mise à jour de Pose-Parquet. En attendant, vous pouvez poursuivre votre projet auprès de nos deux destinations.</p>
    <div class="pm__liens">
      <a class="pm__lien pm__lien--clair" href="https://www.premibel.fr/parquet/">Découvrir Premibel<small>Trouver un parquet →</small></a>
      <a class="pm__lien pm__lien--sombre" href="https://www.allure-design.com/demander-un-devis/">Découvrir Allure Design<small>Pose et rénovation →</small></a>
    </div>
  </div>
</main>
</body>
</html>
