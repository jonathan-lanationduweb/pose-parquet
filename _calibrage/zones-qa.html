<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Zones de sol — contrôle automatique</title>
<style>:root { color-scheme: dark; }
  body { margin: 0; background: #101212; color: #e8e6df; font: 13px/1.6 ui-monospace, monospace; }
  header { padding: 10px; border-bottom: 1px solid #2a2e2e; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 9px; border-bottom: 1px solid #212525; white-space: nowrap; }
  th { color: #8fa; font-weight: normal; }
  b { color: #fff; }
  .ok { color: #6ee7a0; }
  .ko { color: #ff6b5e; background: #2a1210; }
  #log { padding: 8px 10px; white-space: pre-wrap; color: #9aa; }
</style>
</head>
<body>
<header>
  <b>Zones de sol — contrôle automatique</b> — page interne, ni liée ni indexée ni déployée.
  <span id="etat"></span>
</header>
<div id="out"></div>
<pre id="log"></pre>

<script type="module">import { analyzeScene, loadSceneIndex, statutDe } from '../js/scene/analyzer.js';
import { createSceneRenderer } from '../js/scene/renderer.js';
import { loadImage } from '../js/scene/image-loader.js';
import { loadCatalog } from '../js/studio/catalog.js';

const BASE = '../';
const $ = (id) => document.getElementById(id);
const log = (l) => { $('log').textContent += l + '\n'; };


const CLAIR = 'chene-craie';
const FONCE = 'chene-fume';

const TOLERANCE = 4;

const catalog = await loadCatalog(BASE);
const index = await loadSceneIndex(BASE);
const renderer = createSceneRenderer();
$('etat').textContent = `${renderer.backend} · clair=${CLAIR} foncé=${FONCE}`;

const table = document.createElement('table');
table.innerHTML = `<thead><tr>
  <th>scène</th><th>statut</th><th>zone</th><th>surface (groupe)</th>
  <th>pixels</th><th>occultés</th><th>non repeints</th><th>lum. clair</th><th>lum. foncé</th><th>écart</th><th>verdict</th>
</tr></thead><tbody></tbody>`;
$('out').appendChild(table);
const tbody = table.querySelector('tbody');

for (const entry of index.scenes) {
  const scene = await analyzeScene({ sceneId: entry.id, base: BASE });
  const prepared = await loadImage(`${BASE}assets/images/${scene.image.file}`);
  renderer.setScene(scene, prepared);

  const { width, height } = prepared;
  const orig = prepared.canvas.getContext('2d', { willReadFrequently: true })
    .getImageData(0, 0, width, height).data;

  const peindre = async (id) => {
    const c = document.createElement('canvas');
    await renderer.preparer({ material: catalog.get(id), pattern: 'lames' });
    const ok = renderer.paint(c, { material: catalog.get(id), pattern: 'lames', angle: 0, width: null, scale: 1 });
    if (!ok) return null;
    return c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height).data;
  };
  const clair = await peindre(CLAIR);
  const fonce = await peindre(FONCE);
  if (!clair || !fonce) { log(`${entry.id} : rendu impossible`); continue; }

  const labels = renderer.masks.labels;


  const occlusion = renderer.masks.occlusion;
  const occulte = (i) => (occlusion ? occlusion[i] > 8 : false);
  const stats = scene.floorZones.map((z) => ({
    id: z.id, surfaceId: z.surfaceId, n: 0, occultes: 0, trous: 0, sClair: 0, sFonce: 0,
  }));

  for (let i = 0; i < labels.length; i += 1) {
    const zone = labels[i] - 1;
    if (zone < 0 || zone >= stats.length) continue;
    if (occulte(i)) { stats[zone].occultes += 1; continue; }
    const p = i * 4;
    const s = stats[zone];
    s.n += 1;
    s.sClair += 0.2126 * clair[p] + 0.7152 * clair[p + 1] + 0.0722 * clair[p + 2];
    s.sFonce += 0.2126 * fonce[p] + 0.7152 * fonce[p + 1] + 0.0722 * fonce[p + 2];
    const immobileClair = Math.abs(clair[p] - orig[p]) <= TOLERANCE
      && Math.abs(clair[p + 1] - orig[p + 1]) <= TOLERANCE
      && Math.abs(clair[p + 2] - orig[p + 2]) <= TOLERANCE;
    if (!immobileClair) continue;
    const immobileFonce = Math.abs(fonce[p] - orig[p]) <= TOLERANCE
      && Math.abs(fonce[p + 1] - orig[p + 1]) <= TOLERANCE
      && Math.abs(fonce[p + 2] - orig[p + 2]) <= TOLERANCE;
    if (immobileFonce) s.trous += 1;
  }

  stats.forEach((s) => {
    const pct = s.n ? (100 * s.trous) / s.n : 0;
    const lc = s.n ? s.sClair / s.n : 0;
    const lf = s.n ? s.sFonce / s.n : 0;



    const bon = pct < 0.5 && lc - lf > 20;
    const tr = document.createElement('tr');
    tr.className = bon ? 'ok' : 'ko';
    tr.innerHTML = `<td>${entry.id}</td><td>${statutDe(entry)}</td><td>${s.id}</td><td>${s.surfaceId}</td>`
      + `<td>${s.n.toLocaleString('fr')}</td><td>${s.occultes.toLocaleString('fr')}</td><td>${s.trous} (${pct.toFixed(3)} %)</td>`
      + `<td>${lc.toFixed(1)}</td><td>${lf.toFixed(1)}</td><td>${(lc - lf).toFixed(1)}</td>`
      + `<td>${bon ? 'OK' : 'À REPRENDRE'}</td>`;
    tbody.appendChild(tr);
  });

  const total = stats.reduce((a, s) => a + s.n, 0);
  const trous = stats.reduce((a, s) => a + s.trous, 0);
  const occ = stats.reduce((a, s) => a + s.occultes, 0);
  log(`${entry.id.padEnd(20)} ${scene.floorZones.length} zone(s), ${total.toLocaleString('fr')} px peignables, ${occ.toLocaleString('fr')} occultés, ${trous} non repeint(s)`);
}

log('\ncontrôle terminé');
window.zonesQa = { renderer, catalog, index };
</script>
</body>
</html>
