<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Revue visuelle des scènes — outil interne</title>
<style>
  :root { color-scheme: dark; --line: #2c3230; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: #141817; color: #e6ebe8; }
  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 9px 14px; border-bottom: 1px solid var(--line); background: #141817ee; backdrop-filter: blur(8px); }
  select, button, label { font: inherit; }
  button { background: #1e2422; color: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button[aria-pressed="true"] { background: #3d7a5f; border-color: #3d7a5f; }
  h2 { font: 600 13px/1.3 ui-monospace, monospace; margin: 22px 14px 8px; padding-top: 10px; border-top: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell, 420px), 1fr)); gap: 10px; padding: 0 14px; }
  figure { margin: 0; background: #0d0f0f; border-radius: 8px; overflow: hidden; }
  figure canvas, figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 6px 9px; font-size: 11px; color: #9fd0b8; display: flex; justify-content: space-between; gap: 8px; }
  figcaption b { color: #e6ebe8; font-weight: 600; }
  #log { white-space: pre-wrap; padding: 10px 14px 30px; color: #9fd0b8; font-size: 11px; }
  .zoom { --cell: 100%; }
</style>
</head>
<body>
<header>
  <strong>Revue visuelle</strong>
  <label>Scène <select id="scene"><option value="">toutes</option></select></label>
  <button id="run">Rendre</button>
  <label>Cellule <select id="cell">
    <option value="420">420 px</option>
    <option value="560">560 px</option>
    <option value="760">760 px</option>
    <option value="100%">pleine largeur</option>
  </select></label>
  <span id="state"></span>
</header>
<div id="out"></div>
<pre id="log"></pre>

<script type="module">
/**
 * Grille de contrôle visuel des scènes de démonstration.
 *
 * Elle existe parce qu'une mesure de pixels ne dit pas si un parquet a l'air
 * d'appartenir à la pièce. « Le mur est identique à l'octet » prouve qu'on n'a
 * rien débordé ; ça ne prouve pas que la perspective est juste, que l'échelle
 * des lames est plausible, ni que le raccord entre deux pièces est crédible.
 *
 * Pour chaque scène : l'original, puis trois teintes en pose droite, puis les
 * deux motifs en chevron — tous au même cadrage, côte à côte. Les défauts de
 * masque, d'échelle, de fuite et de lumière sautent aux yeux dans cette
 * disposition, et seulement dans celle-là.
 *
 * Page interne : ni liée, ni indexée, ni déployée.
 */
import { analyzeScene, loadSceneIndex } from '../js/scene/analyzer.js';
import { createSceneRenderer } from '../js/scene/renderer.js';
import { createMaterial } from '../js/scene/material.js';
import { loadImage } from '../js/scene/image-loader.js';

const BASE = '../';
const $ = (id) => document.getElementById(id);
const log = (line) => { $('log').textContent += line + '\n'; };

const catalog = await fetch(`${BASE}data/parquets.json`).then((r) => r.json());
const materials = catalog.parquets.map(createMaterial);
const index = await loadSceneIndex(BASE);
const renderer = createSceneRenderer();
$('state').textContent = `${renderer.backend} · aniso ×${renderer.anisotropy}`;

/** Les six vues qui révèlent le plus de défauts, dans cet ordre. */
const VIEWS = [
  { label: 'Original', original: true },
  { label: 'Naturel · droit', material: 'chene-naturel', pattern: 'lames' },
  { label: 'Miel · droit', material: 'chene-miel', pattern: 'lames' },
  { label: 'Fumé · droit', material: 'chene-fume', pattern: 'lames' },
  { label: 'Naturel · point de Hongrie', material: 'chene-naturel', pattern: 'point-de-hongrie' },
  { label: 'Naturel · bâton rompu', material: 'chene-naturel', pattern: 'baton-rompu' },
];

/** Luminance moyenne des pixels de sol : sert à repérer un écart entre zones. */
function zoneLuma(canvas, masks, zoneIndex) {
  const { width, height } = canvas;
  const data = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, width, height).data;
  const labels = masks.labels;
  let sum = 0;
  let count = 0;
  for (let i = 0; i < labels.length; i += 1) {
    if (labels[i] !== zoneIndex + 1) continue;
    const p = i * 4;
    sum += 0.2126 * data[p] + 0.7152 * data[p + 1] + 0.0722 * data[p + 2];
    count += 1;
  }
  return count ? sum / count : null;
}

async function renderScene(entry) {
  const scene = await analyzeScene({ sceneId: entry.id, base: BASE });
  const prepared = await loadImage(`${BASE}assets/images/${scene.image.file}`);
  renderer.setScene(scene, prepared);

  const title = document.createElement('h2');
  title.textContent = `${entry.id} — ${entry.label} · ${scene.floorZones.length} zone(s)`;
  $('out').appendChild(title);
  const grid = document.createElement('div');
  grid.className = 'grid';
  $('out').appendChild(grid);

  VIEWS.forEach((view) => {
    const fig = document.createElement('figure');
    const cap = document.createElement('figcaption');
    let node;
    if (view.original) {
      node = document.createElement('canvas');
      node.width = prepared.width;
      node.height = prepared.height;
      node.getContext('2d').drawImage(prepared.canvas, 0, 0);
      cap.innerHTML = `<b>${view.label}</b><span>photo</span>`;
    } else {
      node = document.createElement('canvas');
      const material = materials.find((m) => m.id === view.material);
      renderer.paint(node, { material, pattern: view.pattern, angle: 0, width: null, scale: 1 });
      // Écart de luminance entre zones : un « trou noir » au fond se voit ici
      // en chiffres avant de se voir à l'œil.
      const lumas = scene.floorZones.map((z, i) => zoneLuma(node, renderer.masks, i));
      const spread =
        lumas.length > 1 && lumas.every((v) => v !== null)
          ? ` · zones ${lumas.map((v) => Math.round(v)).join(' / ')}`
          : '';
      cap.innerHTML = `<b>${view.label}</b><span>${Math.round(lumas[0] || 0)}${spread}</span>`;
    }
    fig.append(node, cap);
    grid.appendChild(fig);
  });

  log(`${entry.id.padEnd(14)} ${prepared.width}×${prepared.height} — ${scene.floorZones.length} zone(s), ${scene.occluders.length} occlusion(s)`);
}

async function run() {
  $('out').innerHTML = '';
  $('log').textContent = '';
  const only = $('scene').value;
  for (const entry of index.scenes) {
    if (only && entry.id !== only) continue;
    await renderScene(entry);
  }
  const cell = $('cell').value;
  document.querySelectorAll('.grid').forEach((g) => g.style.setProperty('--cell', cell === '100%' ? '100%' : `${cell}px`));
  log('\nrevue terminée');
}

index.scenes.forEach((e) => $('scene').append(new Option(e.id, e.id)));
$('scene').addEventListener('change', run);
$('run').addEventListener('click', run);
$('cell').addEventListener('change', () => {
  const v = $('cell').value;
  document.querySelectorAll('.grid').forEach((g) => g.style.setProperty('--cell', v === '100%' ? '100%' : `${v}px`));
});
await run();
window.review = { renderer, materials, run };
</script>
</body>
</html>
