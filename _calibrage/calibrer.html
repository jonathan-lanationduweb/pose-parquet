<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Calibrer une pièce — outil interne</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101212; color: #e8e6df; font: 13px/1.5 ui-monospace, monospace; }
  header { padding: 8px 10px; border-bottom: 1px solid #2a2e2e; }
  #wrap { position: relative; display: block; }
  #photo, #over { display: block; width: 100%; height: auto; }
  #over { position: absolute; inset: 0; }
  #log { white-space: pre-wrap; padding: 8px 10px; margin: 0; font-size: 12px; color: #b8c0b8; }
  b { color: #fff; }
</style>
</head>
<body>
<header>
  <b>Calibrer une pièce</b> — outil interne, ni lié ni indexé ni déployé.
  <span id="etat"></span>
</header>
<div id="wrap"><canvas id="photo"></canvas><canvas id="over"></canvas></div>
<pre id="log"></pre>

<script type="module">
/**
 * Calibrage **scripté** d'une pièce d'exemple.
 *
 * `calibrage.html` sert à calibrer au clic, une scène à la fois. Cette page
 * sert à calibrer au script : elle charge une photo, expose les mesures sur
 * `window.C`, et sait dessiner par-dessus ce qu'elle a mesuré.
 *
 * Ce dernier point est le plus important. Une droite ajustée avec un résidu de
 * 0,4 px peut être parfaitement alignée sur le reflet d'une fenêtre plutôt que
 * sur le pied du mur : le chiffre est bon, la mesure est fausse. `trace()`
 * existe pour qu'aucune valeur n'entre dans data/scenes/ sans avoir été vue
 * posée sur l'image.
 *
 *   ?img=room-couloir.jpg
 */
import {
  intersecte, ajusteDroite, focaleParOrthogonalite, quadDepuisPiece,
  pointAuSol, mesureQuad, etendueVisible,
  orientationLocale, fuiteDesLames, piedDeMur, releveColonnes,
} from './geometrie.js';
import { affineurDeContour, qualiteContour, surLeCadre } from './mask-refine.js';

const BASE = '../';
const $ = (id) => document.getElementById(id);
const log = (...parts) => { $('log').textContent += parts.join(' ') + '\n'; };

/**
 * Chargement à la résolution **native**, sans passer par `image-loader.js`.
 *
 * Le chargeur du visualiseur réduit l'image à 1100 px de large quand la
 * fenêtre en fait moins de 600 : c'est le bon comportement pour le rendu, et
 * le pire possible pour un outil de mesure. Un résidu de 8 px ne veut pas dire
 * la même chose à 1100 px qu'à 1600 px, et la résolution de travail se serait
 * mise à dépendre de la largeur de la fenêtre — donc les mesures d'une session
 * à l'autre ne seraient plus comparables. Ici la taille de l'image est la
 * taille du fichier, toujours.
 */
function chargeNative(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      canvas.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0);
      resolve({ canvas, width: canvas.width, height: canvas.height });
    };
    img.onerror = () => reject(new Error('Image illisible'));
    img.src = src;
  });
}

/**
 * `?img=` accepte un nom de fichier d'`assets/images/`, ou un chemin absolu.
 *
 * Le chemin absolu sert à qualifier une photo **avant** de l'importer : une
 * candidate vit dans `_calibrage/_candidates/`, non versionné et non déployé,
 * et ne rejoint `assets/images/` que si le pré-filtre la retient et que sa
 * licence a été vérifiée sur sa page source. Sans cela il faudrait importer
 * pour évaluer, puis nettoyer les rejets — et un fichier oublié finirait
 * crédité nulle part.
 */
const demande = new URLSearchParams(location.search).get('img') || 'room-couloir.jpg';
const fichier = demande.split('/').pop();
const chemin = demande.startsWith('/') ? demande : `${BASE}assets/images/${demande}`;
const prepared = await chargeNative(chemin);
const photo = prepared.canvas;
const W = photo.width;
const H = photo.height;

$('photo').width = W;
$('photo').height = H;
$('photo').getContext('2d').drawImage(photo, 0, 0);
$('over').width = W;
$('over').height = H;
$('etat').textContent = `${fichier} · ${W}×${H}`;
log(`${fichier} — ${W}×${H}`);

/* ------------------------------------------------------------------ */
/* Superposition : voir ce qu'on a mesuré                              */
/* ------------------------------------------------------------------ */

const g = $('over').getContext('2d');

/**
 * Dessine des objets par-dessus la photo.
 *
 * Accepte des points `{p:{x,y}}`, des droites `{droite:{p,d}}` en pixels, des
 * polygones `{polygone:[...]}` normalisés, et des croix de fuite `{vp:{x,y}}`.
 * Tout est en coordonnées normalisées côté appelant, sauf les droites, qui
 * sortent déjà de `ajusteDroite()` en pixels.
 */
function trace(objets, { effacer = true } = {}) {
  if (effacer) g.clearRect(0, 0, W, H);
  const px = (p) => ({ x: p.x * W, y: p.y * H });
  for (const o of objets) {
    g.lineWidth = o.epaisseur || 2;
    g.strokeStyle = o.couleur || '#ff4d4d';
    g.fillStyle = o.couleur || '#ff4d4d';
    if (o.p) {
      const q = px(o.p);
      g.beginPath();
      g.arc(q.x, q.y, o.rayon || 5, 0, Math.PI * 2);
      g.fill();
    }
    if (o.points) {
      for (const pt of o.points) {
        const q = px(pt);
        g.beginPath();
        g.arc(q.x, q.y, o.rayon || 4, 0, Math.PI * 2);
        g.fill();
      }
    }
    if (o.droite) {
      // Prolongée jusqu'aux bords : c'est ainsi qu'on voit si elle suit
      // vraiment l'arête sur toute sa longueur, ou seulement au milieu.
      const { p, d } = o.droite;
      const t = Math.max(W, H) * 3;
      g.beginPath();
      g.moveTo(p.x - d.x * t, p.y - d.y * t);
      g.lineTo(p.x + d.x * t, p.y + d.y * t);
      g.stroke();
    }
    if (o.polygone) {
      g.beginPath();
      o.polygone.forEach((pt, i) => {
        const q = px(pt);
        if (i === 0) g.moveTo(q.x, q.y); else g.lineTo(q.x, q.y);
      });
      g.closePath();
      g.stroke();
    }
    if (o.vp) {
      const q = px(o.vp);
      g.beginPath();
      g.moveTo(q.x - 18, q.y); g.lineTo(q.x + 18, q.y);
      g.moveTo(q.x, q.y - 18); g.lineTo(q.x, q.y + 18);
      g.stroke();
    }
    if (o.horizon !== undefined) {
      g.beginPath();
      g.moveTo(0, o.horizon * H); g.lineTo(W, o.horizon * H);
      g.stroke();
    }
  }
}

/**
 * Extrait agrandi, en couche fixe, pour juger un bord au pixel.
 * Le volet de prévisualisation réduit la page : sans ce détour, un contour
 * décalé de 3 px est invisible.
 */
function apercu(cx, cy, zoom = 3, avecOverlay = true) {
  document.querySelectorAll('#loupe').forEach((n) => n.remove());
  const LW = 780;
  const LH = 460;
  const sw = LW / zoom;
  const sh = LH / zoom;
  const sx = Math.max(0, Math.min(W - sw, cx * W - sw / 2));
  const sy = Math.max(0, Math.min(H - sh, cy * H - sh / 2));
  const couche = document.createElement('div');
  couche.id = 'loupe';
  couche.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0c0e0e';
  const c = document.createElement('canvas');
  c.width = LW;
  c.height = LH;
  c.style.cssText = `display:block;width:${LW}px;height:${LH}px`;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(photo, sx, sy, sw, sh, 0, 0, LW, LH);
  if (avecOverlay) ctx.drawImage($('over'), sx, sy, sw, sh, 0, 0, LW, LH);
  const t = document.createElement('div');
  t.style.cssText = 'color:#e8e6df;font:700 12px ui-monospace;padding:5px 8px';
  t.textContent = `${fichier} · centre ${cx.toFixed(3)} ${cy.toFixed(3)} · ×${zoom}`;
  couche.append(t, c);
  document.body.appendChild(couche);
  window.scrollTo({ top: 0, behavior: 'instant' });
  return 'loupe';
}
const fermer = () => { document.querySelectorAll('#loupe').forEach((n) => n.remove()); return 'ferme'; };

/* ------------------------------------------------------------------ */
/* Enchaînements utiles                                                */
/* ------------------------------------------------------------------ */

/** Relevé de pieds de mur + droite ajustée, en une fois. */
function ligneDuSol(colonnes, y0, y1) {
  const rows = releveColonnes(photo, colonnes, y0, y1);
  const fit = ajusteDroite(rows.map((r) => ({ x: r.x * W, y: r.y * H })));
  return { rows, fit, forces: rows.map((r) => r.force) };
}

/** Droite ajustée sur des points relevés à la main (normalisés). */
const ligneDepuisPoints = (pts) => ajusteDroite(pts.map((p) => ({ x: p.x * W, y: p.y * H })));

/** Point de fuite de deux droites, en normalisé. */
function fuite(l1, l2) {
  const q = intersecte(l1.p, l1.d, l2.p, l2.d);
  return q ? { x: +(q.x / W).toFixed(4), y: +(q.y / H).toFixed(4) } : null;
}

/**
 * Calibration complète à partir de deux points de fuite et de trois coins.
 * Renvoie le quadrilatère, la focale, l'horizon et les deux preuves.
 */
function calibre({ vpU, vpV, corner, alongU, alongV, hauteurM = 1.5 }) {
  const quad = quadDepuisPiece({ vpU, vpV, corner, alongU, alongV });
  const f = focaleParOrthogonalite(vpU, vpV, W, H);
  // L'horizon est la droite qui joint les deux fuites horizontales. On ne le
  // suppose pas : on le lit. Les deux fuites ayant en pratique des y proches,
  // on retient leur moyenne pondérée par leur éloignement du centre — la plus
  // lointaine est la mieux contrainte.
  const horizon = +((vpU.y + vpV.y) / 2).toFixed(4);
  const camera = { horizonY: horizon, focalPx: f.focalPx, hauteurM, largeur: W, hauteur: H };
  const m = f.focalPx ? mesureQuad(quad, camera) : { ok: false, raison: 'focale indeterminee' };
  return { quad, focale: f, horizon, ecartFuitesY: +Math.abs(vpU.y - vpV.y).toFixed(4), mesure: m, camera };
}

/** Affinage d'un contour + qualité avant/après. */
function affine(polygone) {
  const affineur = affineurDeContour(photo);
  const qualite = qualiteContour(photo);
  const avant = qualite(polygone);
  const apres = affineur(polygone);
  return {
    polygone: apres,
    points: { avant: polygone.length, apres: apres.length },
    gradient: { avant: +avant.toFixed(1), apres: +qualite(apres).toFixed(1) },
    gain: +(qualite(apres) / Math.max(avant, 0.01)).toFixed(2),
  };
}

/**
 * Loupe graduée : elle porte sa propre règle, calculée d'après ses bornes.
 *
 * Sans cette règle, il faut lire les coordonnées sur une grille dessinée dans
 * le repère de l'image, dont les étiquettes tombent presque toujours hors du
 * cadrage de la loupe. Ici les graduations sont toujours visibles et toujours
 * justes : c'est ce qui rend un relevé à l'œil assez précis (± 5 px) pour
 * servir d'entrée à l'affineur, qui cherche à ± 14 px.
 */
function loupe(cx, cy, zoom, pasX = 0.02, pasY = 0.02) {
  document.querySelectorAll('#loupe').forEach((n) => n.remove());
  const LW = 780;
  const LH = 452;
  const sw = LW / zoom;
  const sh = LH / zoom;
  const sx = Math.max(0, Math.min(W - sw, cx * W - sw / 2));
  const sy = Math.max(0, Math.min(H - sh, cy * H - sh / 2));
  const x0 = sx / W;
  const x1 = (sx + sw) / W;
  const y0 = sy / H;
  const y1 = (sy + sh) / H;
  const couche = document.createElement('div');
  couche.id = 'loupe';
  couche.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0c0e0e';
  const c = document.createElement('canvas');
  c.width = LW;
  c.height = LH;
  c.style.cssText = `display:block;width:${LW}px;height:${LH}px`;
  const g2 = c.getContext('2d');
  g2.imageSmoothingEnabled = false;
  g2.drawImage(photo, sx, sy, sw, sh, 0, 0, LW, LH);
  g2.drawImage($('over'), sx, sy, sw, sh, 0, 0, LW, LH);
  g2.font = 'bold 11px monospace';
  g2.lineWidth = 1;
  const X = (nx) => ((nx - x0) / (x1 - x0)) * LW;
  const Y = (ny) => ((ny - y0) / (y1 - y0)) * LH;
  for (let nx = Math.ceil(x0 / pasX) * pasX; nx <= x1; nx += pasX) {
    g2.strokeStyle = 'rgba(255,70,70,0.5)';
    g2.beginPath(); g2.moveTo(X(nx), 0); g2.lineTo(X(nx), LH); g2.stroke();
    g2.fillStyle = '#000'; g2.fillRect(X(nx) - 15, 1, 30, 13);
    g2.fillStyle = '#ff6b6b'; g2.fillText(nx.toFixed(3).slice(1), X(nx) - 13, 11);
  }
  for (let ny = Math.ceil(y0 / pasY) * pasY; ny <= y1; ny += pasY) {
    g2.strokeStyle = 'rgba(90,200,255,0.5)';
    g2.beginPath(); g2.moveTo(0, Y(ny)); g2.lineTo(LW, Y(ny)); g2.stroke();
    g2.fillStyle = '#000'; g2.fillRect(1, Y(ny) - 7, 32, 13);
    g2.fillStyle = '#5cc8ff'; g2.fillText(ny.toFixed(3).slice(1), 3, Y(ny) + 4);
  }
  const t = document.createElement('div');
  t.style.cssText = 'color:#e8e6df;font:700 12px ui-monospace;padding:4px 8px';
  t.textContent = `${fichier} · x ${x0.toFixed(3)}→${x1.toFixed(3)} · y ${y0.toFixed(3)}→${y1.toFixed(3)} · ×${zoom}`;
  couche.append(t, c);
  document.body.appendChild(couche);
  window.scrollTo({ top: 0, behavior: 'instant' });
  return { x0, x1, y0, y1 };
}

/** Grille graduée dans le repère de l'image, pour un premier relevé d'ensemble. */
function grille(x0, x1, y0, y1, pas = 0.05) {
  g.clearRect(0, 0, W, H);
  g.lineWidth = 1.4;
  g.font = 'bold 17px monospace';
  for (let x = x0; x <= x1 + 1e-9; x += pas) {
    g.strokeStyle = 'rgba(255,60,60,0.75)';
    g.beginPath(); g.moveTo(x * W, y0 * H); g.lineTo(x * W, y1 * H); g.stroke();
    g.fillStyle = '#000'; g.fillRect(x * W - 22, y0 * H - 20, 44, 19);
    g.fillStyle = '#ff5555'; g.fillText(x.toFixed(2).slice(1), x * W - 19, y0 * H - 5);
  }
  for (let y = y0; y <= y1 + 1e-9; y += pas) {
    g.strokeStyle = 'rgba(90,200,255,0.75)';
    g.beginPath(); g.moveTo(x0 * W, y * H); g.lineTo(x1 * W, y * H); g.stroke();
    g.fillStyle = '#000'; g.fillRect(x0 * W - 46, y * H - 10, 44, 19);
    g.fillStyle = '#5cc8ff'; g.fillText(y.toFixed(2).slice(1), x0 * W - 43, y * H + 5);
  }
  return 'grille';
}

/**
 * Traque un bord sombre verticalement : à chaque ligne, le minimum de
 * luminance dans une fenêtre autour de la position précédente.
 *
 * Sert à vérifier qu'une ligne droite du monde l'est aussi dans l'image. Un
 * arc systématique — écart positif aux deux bouts, négatif au milieu — est la
 * signature d'une **distorsion en barillet**, que le modèle sténopé de
 * SceneData ne sait pas représenter. C'est ce test qui a écarté room-couloir.
 */
function traqueVerticale(xd, yd, yf, fenetre = 4, pas = 5) {
  const d = photo.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const lum = (x, y) => {
    const p = ((y | 0) * W + (x | 0)) * 4;
    return 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
  };
  let x = xd * W;
  const out = [];
  for (let y = yd * H; y <= yf * H; y += pas) {
    let best = x;
    let bv = Infinity;
    for (let dx = -fenetre; dx <= fenetre; dx += 0.5) {
      const v = (lum(x + dx, y - 1) + lum(x + dx, y) + lum(x + dx, y + 1)) / 3;
      if (v < bv) { bv = v; best = x + dx; }
    }
    out.push({ x: best / W, y: y / H });
    x = best;
  }
  return out;
}

/** Écart signé à la droite ajustée, échantillonné : révèle une courbure. */
function courbure(points) {
  const fit = ajusteDroite(points.map((p) => ({ x: p.x * W, y: p.y * H })));
  if (!fit) return null;
  const ecarts = points.map((p) => (p.x * W - fit.p.x) * fit.d.y - (p.y * H - fit.p.y) * fit.d.x);
  const n = ecarts.length;
  const a = (i) => +ecarts[Math.min(n - 1, Math.max(0, i))].toFixed(2);
  return { n, residuMax: fit.residuMax, residuMoyen: fit.residuMoyen, arc: [a(0), a((n / 4) | 0), a((n / 2) | 0), a(((3 * n) / 4) | 0), a(n - 1)] };
}

/**
 * Traque une arête verticale par le **gradient**, pas par la luminance.
 *
 * `traqueVerticale` suit un minimum de luminance : parfait pour un joint de
 * parquet ou un jambage sombre, inutilisable pour une **marche** de clarté —
 * un placard blanc contre un mur crème, l'arête d'un marbre, un angle de mur.
 * Sur ces bords, elle part en promenade et donne un écart-type d'ajustement de
 * 4 à 10 px, ce qui rendait toute mesure de flèche muette sur quatre photos
 * candidates.
 *
 * Ici on suit le maximum de |dI/dx|, et on **conserve le signe** du saut
 * relevé au départ : sans cela le suivi traverse volontiers une bande claire
 * pour s'accrocher à son autre bord, ce qui fabrique une fausse courbure.
 */
function traqueGradient(xd, yd, yf, fenetre = 6, pas = 4) {
  const d = photo.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const lum = (x, y) => {
    const p = ((y | 0) * W + (x | 0)) * 4;
    return 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
  };
  // Dérivée horizontale, moyennée sur trois lignes pour amortir le bruit.
  const grad = (x, y) => (lum(x + 2, y - 1) - lum(x - 2, y - 1)
    + lum(x + 2, y) - lum(x - 2, y)
    + lum(x + 2, y + 1) - lum(x - 2, y + 1)) / 3;
  let x = xd * W;
  // Signe du saut, relevé une fois au point de départ.
  let signe = 0;
  for (let dx = -fenetre; dx <= fenetre; dx += 0.5) {
    const gg = grad(x + dx, yd * H);
    if (Math.abs(gg) > Math.abs(signe)) signe = gg;
  }
  signe = signe >= 0 ? 1 : -1;
  const out = [];
  // Même prédiction de pente que pour le suivi horizontal : une arête verticale
  // vue en perspective n'est pas verticale dans l'image.
  let pente = 0;
  for (let y = yd * H; y <= yf * H; y += pas) {
    const prediction = x + pente * pas;
    let best = prediction;
    let bv = -Infinity;
    for (let dx = -fenetre; dx <= fenetre; dx += 0.5) {
      const v = signe * grad(prediction + dx, y);
      if (v > bv) { bv = v; best = prediction + dx; }
    }
    out.push({ x: best / W, y: y / H, force: +bv.toFixed(1) });
    x = best;
    if (out.length >= 6) {
      const a = out[out.length - 6];
      const b = out[out.length - 1];
      pente = ((b.x - a.x) * W) / ((b.y - a.y) * H);
    }
  }
  return out;
}

/**
 * Même suivi, mais horizontal : on avance en x et on cherche le maximum de
 * |dI/dy|. Sert aux pieds de murs, seuils, plinthes, arêtes de plafond — les
 * lignes horizontales du monde, dont l'intersection donne un point de fuite.
 */
function traqueGradientH(yd, xd, xf, fenetre = 6, pas = 4) {
  const d = photo.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const lum = (x, y) => {
    const p = ((y | 0) * W + (x | 0)) * 4;
    return 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
  };
  const grad = (x, y) => (lum(x - 1, y + 2) - lum(x - 1, y - 2)
    + lum(x, y + 2) - lum(x, y - 2)
    + lum(x + 1, y + 2) - lum(x + 1, y - 2)) / 3;
  let y = yd * H;
  let signe = 0;
  for (let dy = -fenetre; dy <= fenetre; dy += 0.5) {
    const gg = grad(xd * W, y + dy);
    if (Math.abs(gg) > Math.abs(signe)) signe = gg;
  }
  signe = signe >= 0 ? 1 : -1;
  const out = [];
  const sens = xf > xd ? 1 : -1;
  /**
   * Le suivi **prédit** la pente au lieu de chercher autour du point précédent.
   *
   * Une plinthe qui fuit vers l'horizon a une pente de 1,8 dans l'image : elle
   * se déplace de 5,4 px en y pour 3 px en x, presque la limite d'une fenêtre
   * de ±7 px. Sans prédiction, la recherche est décentrée à chaque pas,
   * l'erreur s'accumule et le suivi finit sur le mur — mesuré : 36 et 48 px de
   * résidu sur les deux plinthes de l'appartement ancien.
   *
   * La pente est estimée sur les derniers points acceptés, jamais sur un seul :
   * un point aberrant décalerait la prédiction de tout le reste du suivi.
   */
  let pente = 0;
  for (let x = xd * W; sens > 0 ? x <= xf * W : x >= xf * W; x += pas * sens) {
    const prediction = y + pente * pas * sens;
    let best = prediction;
    let bv = -Infinity;
    for (let dy = -fenetre; dy <= fenetre; dy += 0.5) {
      const v = signe * grad(x, prediction + dy);
      if (v > bv) { bv = v; best = prediction + dy; }
    }
    out.push({ x: x / W, y: best / H, force: +bv.toFixed(1) });
    y = best;
    if (out.length >= 6) {
      const a = out[out.length - 6];
      const b = out[out.length - 1];
      pente = ((b.y - a.y) * H) / ((b.x - a.x) * W);
    }
  }
  return out;
}

/**
 * Flèche d'une arête verticale **choisie** — le test décisif de distorsion.
 *
 * On traque l'arête, on lui ajuste une parabole, et on renvoie l'écart de
 * cette parabole à sa corde au milieu. Une droite du monde réel doit donner
 * une flèche de l'ordre du pixel ; au-delà de 3 px sur une arête bien décrite
 * (écart-type d'ajustement faible), l'objectif déforme.
 *
 * À choisir **loin du centre de l'image** — la distorsion radiale ne déplace
 * rien sur l'axe optique — et **la plus longue possible**.
 */
function flecheDe(x, y0, y1, fenetre = 6, pas = 4) {
  const pts = traqueGradient(x, y0, y1, fenetre, pas);
  const n = pts.length;
  if (n < 16) return { erreur: 'trace trop courte' };
  const T = pts.map((_, i) => i / (n - 1));
  const X = pts.map((p) => p.x * W);
  let s0 = n; let s1 = 0; let s2 = 0; let s3 = 0; let s4 = 0;
  let y0s = 0; let y1s = 0; let y2s = 0;
  for (let i = 0; i < n; i += 1) {
    const t = T[i];
    const t2 = t * t;
    s1 += t; s2 += t2; s3 += t2 * t; s4 += t2 * t2;
    y0s += X[i]; y1s += X[i] * t; y2s += X[i] * t2;
  }
  const M = [[s4, s3, s2], [s3, s2, s1], [s2, s1, s0]];
  const V = [y2s, y1s, y0s];
  const det3 = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
    - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
    + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det3(M);
  if (Math.abs(D) < 1e-9) return { erreur: 'systeme degenere' };
  const rep = (c) => M.map((row, i) => row.map((v, j) => (j === c ? V[i] : v)));
  const a = det3(rep(0)) / D;
  const b = det3(rep(1)) / D;
  const cc = det3(rep(2)) / D;
  let sse = 0;
  for (let i = 0; i < n; i += 1) sse += (X[i] - (a * T[i] * T[i] + b * T[i] + cc)) ** 2;
  const ecartType = Math.sqrt(sse / n);
  return {
    points: n,
    fleche: +(Math.abs(a) / 4).toFixed(2),
    sens: a > 0 ? 'convexe vers la droite' : 'convexe vers la gauche',
    ecartType: +ecartType.toFixed(2),
    fiable: ecartType < 3,
    xMoyen: +(X.reduce((s, v) => s + v, 0) / n / W).toFixed(3),
  };
}

/* ------------------------------------------------------------------ */
/* Diagnostic préalable : cette photo vaut-elle la peine ?             */
/* ------------------------------------------------------------------ */

/**
 * Les deux frontières mur/sol sont-elles réellement **lisibles** ?
 *
 * C'est la mesure qui manquait. La passe précédente a calibré une photo au
 * résidu de 1,36 px sur son mur gauche, puis a découvert — après le calibrage
 * — que le pied du mur de droite n'était visible nulle part : secrétaire,
 * radiateur, puis un retour de mur. La scène reste `experimental` pour cette
 * seule raison. Aucune des cinq mesures du dépistage ne l'avait vu, parce
 * qu'aucune ne regardait les frontières.
 *
 * Le principe est volontairement bête. Une frontière mur/sol est une arête
 * **horizontale au sens de l'image** : la luminance change franchement quand
 * on descend. On sème donc, colonne par colonne, les maxima du gradient
 * vertical, puis on cherche dans ce semis les droites qui rassemblent le plus
 * de points — par tirages aléatoires, avec une graine fixe pour que deux
 * mesures de la même photo donnent le même chiffre.
 *
 * Quatre droites sont extraites, pas deux : le haut et le bas d'une même
 * plinthe sont deux arêtes franches et quasi parallèles, et se feraient
 * passer pour « deux directions ». On garde donc la meilleure **paire** dont
 * les angles diffèrent assez pour venir de deux murs différents.
 *
 * ————————————————————————————————————————————————————————————————————
 * RÉSULTAT : la mesure ne marche pas. Elle n’entre pas dans le verdict.
 * ————————————————————————————————————————————————————————————————————
 *
 * Éprouvée sur les quatre scènes dont la vérité est connue, elle en classe
 * trois à l’envers :
 *
 *   séjour (validée)              une seule direction, 6,7 deg d’écart
 *   chambre (validée)             sol 23 %, deux directions trouvées
 *   appartement-ancien (validée)  UNE seule droite : « rejeté »
 *   petite-piece (experimental)   « bon », paire à 26,8 deg, fuite plausible
 *
 * Le tracé posé sur l’image dit pourquoi. Sur petite-piece, les quatre
 * droites suivent le plateau du secrétaire, le dessus du radiateur et un
 * cadre accroché au mur — deux d’entre elles ne touchent même pas le sol.
 * Leur « paire à 26,8 deg » et sa fuite à 0,835/0,475, très proche de la
 * vraie, sont une coïncidence. Rien dans la méthode ne contraint une droite
 * à être une frontière mur/sol : le semis de gradient vertical est dominé
 * par le mobilier et les objets accrochés, qui offrent des arêtes plus
 * franches et plus longues que le pied d’un mur.
 *
 * Le résidu et l’étendue étaient bons. Ils décrivaient bien des droites
 * qui ne décrivaient pas la pièce — la même erreur que `trace()` existe
 * pour attraper, refaite un cran plus haut.
 *
 * La fonction reste, dessinable, parce qu’un semis de droites franches est
 * utile pour se repérer sur une photo qu’on découvre. Mais le contour du
 * sol se juge à l’œil, et l’occultation d’un pied de mur se constate à la
 * loupe. C’est ce qui a été fait pour petite-piece, et c’est ce qui a
 * décidé de son statut.
 */
function frontieres() {
  const ctx = photo.getContext('2d', { willReadFrequently: true });
  const data = ctx.getImageData(0, 0, W, H).data;
  const lum = (x, y) => {
    const p = ((y | 0) * W + (x | 0)) * 4;
    return 0.2126 * data[p] + 0.7152 * data[p + 1] + 0.0722 * data[p + 2];
  };

  /* 1. Semis : maxima du gradient vertical, colonne par colonne ------- */
  // La bande part de 0,32 H — au-dessus, on est dans le mur ou la fenêtre —
  // et descend jusqu'à 0,97 H. Quatre maxima par colonne au plus : le pied du
  // mur, les deux arêtes d'une plinthe, un bord de meuble.
  const semis = [];
  const yHaut = Math.round(H * 0.32);
  const yBas = Math.round(H * 0.97);
  for (let x = 6; x < W - 6; x += 8) {
    const g = new Float32Array(yBas - yHaut);
    for (let y = yHaut; y < yBas; y += 1) g[y - yHaut] = Math.abs(lum(x, y + 3) - lum(x, y - 3));
    const tries = Array.from(g).sort((a, b) => a - b);
    const median = tries[Math.floor(tries.length / 2)];
    const seuil = Math.max(7, median * 3);
    const locaux = [];
    for (let i = 3; i < g.length - 3; i += 1) {
      if (g[i] < seuil) continue;
      if (g[i] < g[i - 1] || g[i] < g[i + 1]) continue;
      locaux.push({ y: yHaut + i, force: g[i] });
    }
    locaux.sort((a, b) => b.force - a.force);
    const gardes = [];
    for (const l of locaux) {
      if (gardes.length >= 4) break;
      if (gardes.every((k) => Math.abs(k.y - l.y) > 12)) gardes.push(l);
    }
    for (const k of gardes) semis.push({ x, y: k.y, force: k.force });
  }

  /* 2. Quatre droites, par tirages à graine fixe ---------------------- */
  const TOL = 2.0; // px
  let graine = 20260903;
  const tire = (n) => {
    graine = (graine * 1103515245 + 12345) & 0x7fffffff;
    return graine % n;
  };
  const contrasteDe = (pts) => {
    const ecarts = pts.map((p) => Math.abs(lum(p.x, Math.max(0, p.y - 9)) - lum(p.x, Math.min(H - 1, p.y + 9))));
    return +(ecarts.reduce((s, e) => s + e, 0) / Math.max(1, ecarts.length)).toFixed(1);
  };
  const droites = [];
  let restants = semis.slice();
  for (let k = 0; k < 4 && restants.length >= 24; k += 1) {
    let meilleur = null;
    for (let essai = 0; essai < 3000; essai += 1) {
      const a = restants[tire(restants.length)];
      const b = restants[tire(restants.length)];
      if (Math.abs(a.x - b.x) < W * 0.25) continue; // deux points proches définissent mal une droite
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const norme = Math.hypot(dx, dy);
      const inliers = restants.filter((p) => Math.abs((p.x - a.x) * (dy / norme) - (p.y - a.y) * (dx / norme)) < TOL);
      if (!meilleur || inliers.length > meilleur.length) meilleur = inliers;
    }
    if (!meilleur || meilleur.length < 24) break;
    // Affinage en moindres carrés totaux, puis recomptage sur la droite affinée.
    const brut = ajusteDroite(meilleur);
    const proches = restants.filter((p) => Math.abs((p.x - brut.p.x) * brut.d.y - (p.y - brut.p.y) * brut.d.x) < TOL);
    const fin = ajusteDroite(proches);
    const xs = proches.map((p) => p.x);
    droites.push({
      p: fin.p,
      d: fin.d,
      points: proches.length,
      etendue: +((Math.max(...xs) - Math.min(...xs)) / W).toFixed(3),
      residuMax: fin.residuMax,
      residuMoyen: fin.residuMoyen,
      angleDeg: +((Math.atan2(fin.d.y, fin.d.x) * 180) / Math.PI).toFixed(1),
      contraste: contrasteDe(proches),
      xMoyen: +(fin.p.x / W).toFixed(3),
      yMoyen: +(fin.p.y / H).toFixed(3),
    });
    // On retire les points consommés, avec une marge : sinon la droite
    // suivante se recale sur le même bord à un pixel près.
    restants = restants.filter((p) => Math.abs((p.x - fin.p.x) * fin.d.y - (p.y - fin.p.y) * fin.d.x) >= TOL * 2);
  }

  /* 3. La meilleure paire venant de deux murs différents -------------- */
  const ecartAngulaire = (a, b) => {
    let e = Math.abs(a.angleDeg - b.angleDeg) % 180;
    return e > 90 ? 180 - e : e;
  };
  let paire = null;
  for (let i = 0; i < droites.length; i += 1) {
    for (let j = i + 1; j < droites.length; j += 1) {
      const e = ecartAngulaire(droites[i], droites[j]);
      if (e < 6) continue; // quasi parallèles : même mur, ou deux arêtes d'une plinthe
      const score = Math.min(droites[i].etendue, droites[j].etendue);
      if (!paire || score > paire.score) paire = { a: droites[i], b: droites[j], ecartDeg: +e.toFixed(1), score };
    }
  }
  let fuiteCommune = null;
  if (paire) {
    const v = intersecte(paire.a.p, paire.a.d, paire.b.p, paire.b.d);
    if (v) fuiteCommune = { x: +(v.x / W).toFixed(3), y: +(v.y / H).toFixed(3) };
  }
  return {
    semis: semis.length,
    droites: droites.map(({ p, d, ...reste }) => reste),
    paire: paire ? {
      ecartDeg: paire.ecartDeg,
      a: { etendue: paire.a.etendue, points: paire.a.points, residuMax: paire.a.residuMax, contraste: paire.a.contraste, angleDeg: paire.a.angleDeg },
      b: { etendue: paire.b.etendue, points: paire.b.points, residuMax: paire.b.residuMax, contraste: paire.b.contraste, angleDeg: paire.b.angleDeg },
      fuite: fuiteCommune,
    } : null,
    _droites: droites,
  };
}

/**
 * Qualifie une photo **avant** de la calibrer.
 *
 * Ce n'est pas une analyse d'image intelligente, et ça ne prétend pas l'être.
 * Ce sont cinq mesures, chacune avec un seuil, et un verdict qui n'engage
 * qu'un ordre de priorité. La décision reste humaine : une photo « bon
 * candidat » peut donner un rendu laid, et le contraire arrive aussi.
 *
 * Il existe parce qu'une photo a coûté une demi-journée de calibrage avant de
 * révéler une distorsion en barillet qui rendait l'exercice impossible. La
 * mesure qui l'aurait écartée en trente secondes est la **flèche d'arc** : on
 * traque des arêtes verticales franches — jambages de porte, angles de murs —
 * et on regarde de combien elles s'écartent de leur propre droite. Une droite
 * du monde réel doit être droite dans l'image ; si elle bombe, l'objectif
 * déforme et le modèle sténopé de SceneData ne peut pas décrire la scène.
 *
 * Les seuils ne sont pas inventés : ils sont calés sur les scènes déjà
 * validées d'un côté, sur la scène rejetée de l'autre. Voir
 * docs/photo-lens-distortion.md.
 */
function diagnostic({ verbeux = false } = {}) {
  const ctx = photo.getContext('2d', { willReadFrequently: true });
  const data = ctx.getImageData(0, 0, W, H).data;
  const lum = (x, y) => {
    const p = ((y | 0) * W + (x | 0)) * 4;
    return 0.2126 * data[p] + 0.7152 * data[p + 1] + 0.0722 * data[p + 2];
  };

  /* 1. Résolution ---------------------------------------------------- */
  const resolution = { largeur: W, hauteur: H, suffisante: W >= 1200 && H >= 800 };

  /* 2. Arêtes verticales : semis automatique par énergie de gradient -- */
  // On somme |dI/dx| sur la moitié haute de chaque colonne : les jambages et
  // les angles de murs y ressortent, le sol n'y est pas.
  const energie = new Float32Array(W);
  for (let x = 2; x < W - 2; x += 1) {
    let s = 0;
    for (let y = Math.round(H * 0.12); y < Math.round(H * 0.58); y += 3) {
      s += Math.abs(lum(x + 2, y) - lum(x - 2, y));
    }
    energie[x] = s;
  }
  const candidates = [];
  for (let x = 30; x < W - 30; x += 1) {
    if (energie[x] > energie[x - 1] && energie[x] >= energie[x + 1]) candidates.push({ x, e: energie[x] });
  }
  /**
   * Les arêtes loin du centre passent d'abord.
   *
   * La distorsion radiale déplace les points le long du rayon depuis le centre
   * optique : une verticale qui passe près de l'axe reste droite, quelle que
   * soit la force de la distorsion. Trier sur la seule énergie de gradient
   * revient donc à échantillonner là où il n'y a rien à voir — c'est ainsi que
   * le couloir, dont un jambage bombe de 7,4 px, a d'abord été mesuré à 1 px.
   */
  candidates.forEach((c) => { c.poids = c.e * (0.35 + Math.abs(c.x / W - 0.5) * 1.6); });
  candidates.sort((a, b) => b.poids - a.poids);
  const retenues = [];
  for (const c of candidates) {
    if (retenues.length >= 6) break;
    if (retenues.every((r) => Math.abs(r.x - c.x) > 60)) retenues.push(c);
  }

  /**
   * Toutes les arêtes traquées ne valent pas mesure.
   *
   * Le traqueur suit le minimum de luminance de ligne en ligne : sur un pli de
   * rideau ou un bord de meuble, il part en promenade et produit un résidu
   * énorme. Compter ce résidu comme de la distorsion serait faux, et c'est
   * exactement ce qui a d'abord fait déclarer le séjour — scène de référence —
   * « mauvais candidat ».
   *
   * Deux critères séparent l'arc optique de la dérive :
   *
   *   - **rugosité** : la moyenne quadratique des différences secondes du
   *     tracé. Un arc de distorsion est lisse, sa rugosité est inférieure au
   *     pixel ; une dérive zigzague et la fait exploser ;
   *   - **régularité** : un arc de distorsion reste du même côté de la corde
   *     sur toute sa longueur. Une dérive change de côté.
   *
   * Seules les arêtes lisses ET régulières entrent dans le verdict. Les autres
   * sont conservées dans le détail, marquées « écartée », pour qu'on voie ce
   * qui a été ignoré plutôt que de le deviner.
   */
  const verticales = retenues.map((c) => {
    const pts = traqueGradient(c.x / W, 0.12, 0.66, 6, 4);
    if (pts.length < 16) return null;
    const n = pts.length;
    // t normalisé sur la longueur suivie, x en pixels : on ajuste x = a·t² + b·t + c.
    const T = pts.map((_, i) => i / (n - 1));
    const X = pts.map((p) => p.x * W);
    // Moindres carrés à trois inconnues, résolus par les équations normales.
    let s0 = n; let s1 = 0; let s2 = 0; let s3 = 0; let s4 = 0;
    let y0 = 0; let y1 = 0; let y2 = 0;
    for (let i = 0; i < n; i += 1) {
      const t = T[i];
      const t2 = t * t;
      s1 += t; s2 += t2; s3 += t2 * t; s4 += t2 * t2;
      y0 += X[i]; y1 += X[i] * t; y2 += X[i] * t2;
    }
    const M = [[s4, s3, s2], [s3, s2, s1], [s2, s1, s0]];
    const V = [y2, y1, y0];
    const det3 = (m) => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1])
      - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0])
      + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
    const D = det3(M);
    if (Math.abs(D) < 1e-9) return null;
    const remplace = (col) => M.map((row, i) => row.map((v, j) => (j === col ? V[i] : v)));
    const a = det3(remplace(0)) / D;
    const b = det3(remplace(1)) / D;
    const cc = det3(remplace(2)) / D;
    // Résidus de la parabole et de la droite : la part expliquée par la
    // courbure dit si le bombement est réel ou si le suivi a dérivé.
    let sseQuad = 0;
    for (let i = 0; i < n; i += 1) sseQuad += (X[i] - (a * T[i] * T[i] + b * T[i] + cc)) ** 2;
    const mt = s1 / n;
    const mx = y0 / n;
    let stt = 0; let stx = 0;
    for (let i = 0; i < n; i += 1) { stt += (T[i] - mt) ** 2; stx += (T[i] - mt) * (X[i] - mx); }
    const pente = stt > 1e-9 ? stx / stt : 0;
    let sseLin = 0;
    for (let i = 0; i < n; i += 1) sseLin += (X[i] - (mx + pente * (T[i] - mt))) ** 2;
    const partCourbure = sseLin > 1e-6 ? 1 - sseQuad / sseLin : 0;
    // Flèche : écart de la parabole à sa corde, au milieu. |a| / 4.
    const fleche = Math.abs(a) / 4;
    const ecartTypeQuad = Math.sqrt(sseQuad / n);
    /**
     * Une arête est exploitable quand la parabole **décrit bien** le tracé.
     *
     * Rien de plus. Exiger en plus que la courbure explique l'essentiel de
     * l'écart à la droite serait à l'envers : sur une photo sans distorsion la
     * ligne est droite, la parabole n'ajoute donc rien au modèle linéaire et
     * cette part tombe à 0,13. C'est le signe d'une bonne photo, pas d'une
     * mauvaise mesure — le séjour, scène de référence, était rejeté par ce
     * critère.
     *
     * `partCourbure` reste affichée, à titre d'information.
     */
    const retenue = ecartTypeQuad < 1.5;
    return {
      x: +(c.x / W).toFixed(3),
      energie: Math.round(c.e),
      points: n,
      fleche: +fleche.toFixed(2),
      partCourbure: +partCourbure.toFixed(2),
      ecartTypeQuad: +ecartTypeQuad.toFixed(2),
      retenue,
    };
  }).filter(Boolean);

  const utiles = verticales.filter((v) => v.retenue);
  const fleches = utiles.map((v) => v.fleche).sort((a, b) => a - b);
  const flecheMediane = fleches.length ? fleches[Math.floor(fleches.length / 2)] : null;
  const flecheMax = fleches.length ? fleches[fleches.length - 1] : null;

  /* 3. Champ d'orientation du sol : une fuite est-elle identifiable ? - */
  // Si une famille de lignes du sol converge, son angle balaie l'image de
  // façon monotone. On mesure ce balayage et sa régularité.
  const echantillons = [];
  for (let ny = 0.7; ny <= 0.95; ny += 0.06) {
    for (let nx = 0.15; nx <= 0.85; nx += 0.07) {
      const o = orientationLocale(photo, nx, ny, 45);
      if (o.coherence > 0.5) echantillons.push({ nx, ny, angle: o.angle, coherence: o.coherence });
    }
  }
  let balayage = null;
  if (echantillons.length >= 8) {
    // Régression de l'angle sur x, en repliant les angles pour éviter le saut 0/180.
    const base = echantillons[0].angle;
    const plie = echantillons.map((e) => {
      let a = e.angle;
      while (a - base > 90) a -= 180;
      while (base - a > 90) a += 180;
      return { x: e.nx, a };
    });
    const n = plie.length;
    const mx = plie.reduce((s, p) => s + p.x, 0) / n;
    const ma = plie.reduce((s, p) => s + p.a, 0) / n;
    let sxa = 0;
    let sxx = 0;
    let saa = 0;
    for (const p of plie) { sxa += (p.x - mx) * (p.a - ma); sxx += (p.x - mx) ** 2; saa += (p.a - ma) ** 2; }
    const pente = sxx > 1e-9 ? sxa / sxx : 0;
    const r = sxx > 1e-9 && saa > 1e-9 ? sxa / Math.sqrt(sxx * saa) : 0;
    balayage = { points: n, penteDegParLargeur: +pente.toFixed(1), correlation: +r.toFixed(3) };
  }

  /* 4. Surface de sol : quelle part de la moitié basse est continue ? - */
  // Blocs de 24 px comparés à la couleur médiane des blocs du bas. C'est une
  // indication, pas une segmentation : un tapis ou un meuble comptent contre.
  const pas = 24;
  const blocs = [];
  for (let y = Math.round(H * 0.55); y < H - pas; y += pas) {
    for (let x = 0; x < W - pas; x += pas) {
      let r = 0;
      let g2 = 0;
      let b = 0;
      let k = 0;
      for (let dy = 0; dy < pas; dy += 6) {
        for (let dx = 0; dx < pas; dx += 6) {
          const p = ((y + dy) * W + x + dx) * 4;
          r += data[p]; g2 += data[p + 1]; b += data[p + 2]; k += 1;
        }
      }
      blocs.push({ x, y, r: r / k, g: g2 / k, b: b / k });
    }
  }
  const bas = blocs.filter((bl) => bl.y > H * 0.85);
  const med = (arr) => { const s = [...arr].sort((a, b) => a - b); return s.length ? s[Math.floor(s.length / 2)] : 0; };
  const ref = { r: med(bas.map((b) => b.r)), g: med(bas.map((b) => b.g)), b: med(bas.map((b) => b.b)) };
  const proches = blocs.filter((bl) => Math.hypot(bl.r - ref.r, bl.g - ref.g, bl.b - ref.b) < 48);
  const surface = {
    partMoitieBasse: blocs.length ? +(proches.length / blocs.length).toFixed(3) : 0,
    couleurReference: [Math.round(ref.r), Math.round(ref.g), Math.round(ref.b)],
  };


  /* 5. Verdict ------------------------------------------------------- */
  const griefs = [];
  const reserves = [];
  if (!resolution.suffisante) griefs.push(`résolution ${W}×${H} insuffisante`);
  if (flecheMediane === null) reserves.push(`aucune arête verticale exploitable sur ${verticales.length} traquées : distorsion non contrôlable`);
  else if (flecheMediane > 3) griefs.push(`flèche d'arc médiane ${flecheMediane} px — distorsion optique`);
  else if (flecheMediane > 1.6) reserves.push(`flèche d'arc médiane ${flecheMediane} px — distorsion légère`);
  if (surface.partMoitieBasse < 0.22) griefs.push(`sol continu sur ${Math.round(surface.partMoitieBasse * 100)} % de la moitié basse`);
  else if (surface.partMoitieBasse < 0.35) reserves.push(`sol continu sur ${Math.round(surface.partMoitieBasse * 100)} % seulement`);
  if (!balayage) reserves.push('champ d’orientation du sol trop faible pour lire une fuite');
  else if (Math.abs(balayage.penteDegParLargeur) < 12 || Math.abs(balayage.correlation) < 0.5) {
    reserves.push(`balayage angulaire faible (${balayage.penteDegParLargeur}°, r=${balayage.correlation}) — fuite mal contrainte`);
  }

  // Un « BON CANDIDAT » est un resultat de DEPISTAGE, pas une garantie : le
  // semis automatique peut tomber sur des aretes qui ne bombent pas. Le test
  // decisif reste flecheDe() sur une arete franche choisie a l oeil, loin du
  // centre de l image et la plus longue possible.
  const verdict = griefs.length ? 'MAUVAIS CANDIDAT' : reserves.length ? 'À VÉRIFIER' : 'BON CANDIDAT';
  /**
   * Le classement à quatre niveaux sert à trancher « calibrer ou pas ».
   *
   * EXCELLENT est « aucune réserve », BON « une seule », MOYEN « deux ou
   * plus », REJETÉ « au moins un grief ». Rien de plus.
   *
   * Une grille plus exigeante a été essayée — flèche ≤ 1 px, sol ≥ 30 %,
   * corrélation du balayage ≥ 0,7 — et jetée : elle ne laissait AUCUNE des
   * cinq scènes validées atteindre EXCELLENT. Des seuils qu’aucun exemple
   * connu ne franchit ne mesurent rien ; ils déguisent une préférence en
   * critère. Les quatre niveaux comptent donc les réserves déjà calées sur
   * le corpus, et rien d’autre.
   *
   * Ce dépistage ne sépare pas le bon du mauvais : séjour, pièce claire,
   * contraste (validées), couloir et petite-piece (experimental) sortent
   * toutes BON. Il écarte les photos grossièrement inutilisables — c’est
   * tout ce qu’on lui demande, et c’est déjà ce qui a fait gagner du temps.
   *
   * Les frontières mur/sol n’entrent PAS dans ce classement. Voir
   * `frontieres()` : la mesure existe, elle a été éprouvée sur les scènes
   * dont on connaît la vérité, et elle s’est révélée non prédictive. Le
   * contour du sol reste jugé à l’œil.
   */
  const large = !reserves.length;
  const classe = griefs.length ? 'REJETÉ' : large ? 'EXCELLENT' : reserves.length <= 1 ? 'BON' : 'MOYEN';
  const bilan = { fichier, classe, verdict, griefs, reserves, resolution, aretes: { traquees: verticales.length, retenues: utiles.length }, flecheMediane, flecheMax, balayage, surface };
  if (verbeux) bilan.verticales = verticales;
  return bilan;
}

window.C = {
  photo, W, H, fichier, log, trace, apercu, fermer,
  loupe, grille, traqueVerticale, traqueGradient, traqueGradientH, courbure, diagnostic, flecheDe, frontieres,
  ligneDuSol, ligneDepuisPoints, fuite, calibre, affine,
  intersecte, ajusteDroite, focaleParOrthogonalite, quadDepuisPiece,
  pointAuSol, mesureQuad, etendueVisible,
  orientationLocale, fuiteDesLames, piedDeMur, releveColonnes,
  surLeCadre,
};
log('prêt — window.C');
