<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow" />
<title>Calibrer une pièce — outil interne</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #101212; color: #e8e6df; font: 13px/1.5 ui-monospace, monospace; }
  header { padding: 8px 10px; border-bottom: 1px solid #2a2e2e; }
  #wrap { position: relative; display: block; }
  #photo, #over { display: block; width: 100%; height: auto; }
  #over { position: absolute; inset: 0; }
  #log { white-space: pre-wrap; padding: 8px 10px; margin: 0; font-size: 12px; color: #b8c0b8; }
  b { color: #fff; }
</style>
</head>
<body>
<header>
  <b>Calibrer une pièce</b> — outil interne, ni lié ni indexé ni déployé.
  <span id="etat"></span>
</header>
<div id="wrap"><canvas id="photo"></canvas><canvas id="over"></canvas></div>
<pre id="log"></pre>

<script type="module">
/**
 * Calibrage **scripté** d'une pièce d'exemple.
 *
 * `calibrage.html` sert à calibrer au clic, une scène à la fois. Cette page
 * sert à calibrer au script : elle charge une photo, expose les mesures sur
 * `window.C`, et sait dessiner par-dessus ce qu'elle a mesuré.
 *
 * Ce dernier point est le plus important. Une droite ajustée avec un résidu de
 * 0,4 px peut être parfaitement alignée sur le reflet d'une fenêtre plutôt que
 * sur le pied du mur : le chiffre est bon, la mesure est fausse. `trace()`
 * existe pour qu'aucune valeur n'entre dans data/scenes/ sans avoir été vue
 * posée sur l'image.
 *
 *   ?img=room-couloir.jpg
 */
import {
  intersecte, ajusteDroite, focaleParOrthogonalite, quadDepuisPiece,
  pointAuSol, mesureQuad, etendueVisible,
  orientationLocale, fuiteDesLames, piedDeMur, releveColonnes,
} from './geometrie.js';
import { affineurDeContour, qualiteContour, surLeCadre } from './mask-refine.js';
import { loadImage } from '../js/scene/image-loader.js';

const BASE = '../';
const $ = (id) => document.getElementById(id);
const log = (...parts) => { $('log').textContent += parts.join(' ') + '\n'; };

const fichier = new URLSearchParams(location.search).get('img') || 'room-couloir.jpg';
const prepared = await loadImage(`${BASE}assets/images/${fichier}`);
const photo = prepared.canvas;
const W = photo.width;
const H = photo.height;

$('photo').width = W;
$('photo').height = H;
$('photo').getContext('2d').drawImage(photo, 0, 0);
$('over').width = W;
$('over').height = H;
$('etat').textContent = `${fichier} · ${W}×${H}`;
log(`${fichier} — ${W}×${H}`);

/* ------------------------------------------------------------------ */
/* Superposition : voir ce qu'on a mesuré                              */
/* ------------------------------------------------------------------ */

const g = $('over').getContext('2d');

/**
 * Dessine des objets par-dessus la photo.
 *
 * Accepte des points `{p:{x,y}}`, des droites `{droite:{p,d}}` en pixels, des
 * polygones `{polygone:[...]}` normalisés, et des croix de fuite `{vp:{x,y}}`.
 * Tout est en coordonnées normalisées côté appelant, sauf les droites, qui
 * sortent déjà de `ajusteDroite()` en pixels.
 */
function trace(objets, { effacer = true } = {}) {
  if (effacer) g.clearRect(0, 0, W, H);
  const px = (p) => ({ x: p.x * W, y: p.y * H });
  for (const o of objets) {
    g.lineWidth = o.epaisseur || 2;
    g.strokeStyle = o.couleur || '#ff4d4d';
    g.fillStyle = o.couleur || '#ff4d4d';
    if (o.p) {
      const q = px(o.p);
      g.beginPath();
      g.arc(q.x, q.y, o.rayon || 5, 0, Math.PI * 2);
      g.fill();
    }
    if (o.points) {
      for (const pt of o.points) {
        const q = px(pt);
        g.beginPath();
        g.arc(q.x, q.y, o.rayon || 4, 0, Math.PI * 2);
        g.fill();
      }
    }
    if (o.droite) {
      // Prolongée jusqu'aux bords : c'est ainsi qu'on voit si elle suit
      // vraiment l'arête sur toute sa longueur, ou seulement au milieu.
      const { p, d } = o.droite;
      const t = Math.max(W, H) * 3;
      g.beginPath();
      g.moveTo(p.x - d.x * t, p.y - d.y * t);
      g.lineTo(p.x + d.x * t, p.y + d.y * t);
      g.stroke();
    }
    if (o.polygone) {
      g.beginPath();
      o.polygone.forEach((pt, i) => {
        const q = px(pt);
        if (i === 0) g.moveTo(q.x, q.y); else g.lineTo(q.x, q.y);
      });
      g.closePath();
      g.stroke();
    }
    if (o.vp) {
      const q = px(o.vp);
      g.beginPath();
      g.moveTo(q.x - 18, q.y); g.lineTo(q.x + 18, q.y);
      g.moveTo(q.x, q.y - 18); g.lineTo(q.x, q.y + 18);
      g.stroke();
    }
    if (o.horizon !== undefined) {
      g.beginPath();
      g.moveTo(0, o.horizon * H); g.lineTo(W, o.horizon * H);
      g.stroke();
    }
  }
}

/**
 * Extrait agrandi, en couche fixe, pour juger un bord au pixel.
 * Le volet de prévisualisation réduit la page : sans ce détour, un contour
 * décalé de 3 px est invisible.
 */
function apercu(cx, cy, zoom = 3, avecOverlay = true) {
  document.querySelectorAll('#loupe').forEach((n) => n.remove());
  const LW = 780;
  const LH = 460;
  const sw = LW / zoom;
  const sh = LH / zoom;
  const sx = Math.max(0, Math.min(W - sw, cx * W - sw / 2));
  const sy = Math.max(0, Math.min(H - sh, cy * H - sh / 2));
  const couche = document.createElement('div');
  couche.id = 'loupe';
  couche.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0c0e0e';
  const c = document.createElement('canvas');
  c.width = LW;
  c.height = LH;
  c.style.cssText = `display:block;width:${LW}px;height:${LH}px`;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(photo, sx, sy, sw, sh, 0, 0, LW, LH);
  if (avecOverlay) ctx.drawImage($('over'), sx, sy, sw, sh, 0, 0, LW, LH);
  const t = document.createElement('div');
  t.style.cssText = 'color:#e8e6df;font:700 12px ui-monospace;padding:5px 8px';
  t.textContent = `${fichier} · centre ${cx.toFixed(3)} ${cy.toFixed(3)} · ×${zoom}`;
  couche.append(t, c);
  document.body.appendChild(couche);
  window.scrollTo({ top: 0, behavior: 'instant' });
  return 'loupe';
}
const fermer = () => { document.querySelectorAll('#loupe').forEach((n) => n.remove()); return 'ferme'; };

/* ------------------------------------------------------------------ */
/* Enchaînements utiles                                                */
/* ------------------------------------------------------------------ */

/** Relevé de pieds de mur + droite ajustée, en une fois. */
function ligneDuSol(colonnes, y0, y1) {
  const rows = releveColonnes(photo, colonnes, y0, y1);
  const fit = ajusteDroite(rows.map((r) => ({ x: r.x * W, y: r.y * H })));
  return { rows, fit, forces: rows.map((r) => r.force) };
}

/** Droite ajustée sur des points relevés à la main (normalisés). */
const ligneDepuisPoints = (pts) => ajusteDroite(pts.map((p) => ({ x: p.x * W, y: p.y * H })));

/** Point de fuite de deux droites, en normalisé. */
function fuite(l1, l2) {
  const q = intersecte(l1.p, l1.d, l2.p, l2.d);
  return q ? { x: +(q.x / W).toFixed(4), y: +(q.y / H).toFixed(4) } : null;
}

/**
 * Calibration complète à partir de deux points de fuite et de trois coins.
 * Renvoie le quadrilatère, la focale, l'horizon et les deux preuves.
 */
function calibre({ vpU, vpV, corner, alongU, alongV, hauteurM = 1.5 }) {
  const quad = quadDepuisPiece({ vpU, vpV, corner, alongU, alongV });
  const f = focaleParOrthogonalite(vpU, vpV, W, H);
  // L'horizon est la droite qui joint les deux fuites horizontales. On ne le
  // suppose pas : on le lit. Les deux fuites ayant en pratique des y proches,
  // on retient leur moyenne pondérée par leur éloignement du centre — la plus
  // lointaine est la mieux contrainte.
  const horizon = +((vpU.y + vpV.y) / 2).toFixed(4);
  const camera = { horizonY: horizon, focalPx: f.focalPx, hauteurM, largeur: W, hauteur: H };
  const m = f.focalPx ? mesureQuad(quad, camera) : { ok: false, raison: 'focale indeterminee' };
  return { quad, focale: f, horizon, ecartFuitesY: +Math.abs(vpU.y - vpV.y).toFixed(4), mesure: m, camera };
}

/** Affinage d'un contour + qualité avant/après. */
function affine(polygone) {
  const affineur = affineurDeContour(photo);
  const qualite = qualiteContour(photo);
  const avant = qualite(polygone);
  const apres = affineur(polygone);
  return {
    polygone: apres,
    points: { avant: polygone.length, apres: apres.length },
    gradient: { avant: +avant.toFixed(1), apres: +qualite(apres).toFixed(1) },
    gain: +(qualite(apres) / Math.max(avant, 0.01)).toFixed(2),
  };
}

/**
 * Loupe graduée : elle porte sa propre règle, calculée d'après ses bornes.
 *
 * Sans cette règle, il faut lire les coordonnées sur une grille dessinée dans
 * le repère de l'image, dont les étiquettes tombent presque toujours hors du
 * cadrage de la loupe. Ici les graduations sont toujours visibles et toujours
 * justes : c'est ce qui rend un relevé à l'œil assez précis (± 5 px) pour
 * servir d'entrée à l'affineur, qui cherche à ± 14 px.
 */
function loupe(cx, cy, zoom, pasX = 0.02, pasY = 0.02) {
  document.querySelectorAll('#loupe').forEach((n) => n.remove());
  const LW = 780;
  const LH = 452;
  const sw = LW / zoom;
  const sh = LH / zoom;
  const sx = Math.max(0, Math.min(W - sw, cx * W - sw / 2));
  const sy = Math.max(0, Math.min(H - sh, cy * H - sh / 2));
  const x0 = sx / W;
  const x1 = (sx + sw) / W;
  const y0 = sy / H;
  const y1 = (sy + sh) / H;
  const couche = document.createElement('div');
  couche.id = 'loupe';
  couche.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#0c0e0e';
  const c = document.createElement('canvas');
  c.width = LW;
  c.height = LH;
  c.style.cssText = `display:block;width:${LW}px;height:${LH}px`;
  const g2 = c.getContext('2d');
  g2.imageSmoothingEnabled = false;
  g2.drawImage(photo, sx, sy, sw, sh, 0, 0, LW, LH);
  g2.drawImage($('over'), sx, sy, sw, sh, 0, 0, LW, LH);
  g2.font = 'bold 11px monospace';
  g2.lineWidth = 1;
  const X = (nx) => ((nx - x0) / (x1 - x0)) * LW;
  const Y = (ny) => ((ny - y0) / (y1 - y0)) * LH;
  for (let nx = Math.ceil(x0 / pasX) * pasX; nx <= x1; nx += pasX) {
    g2.strokeStyle = 'rgba(255,70,70,0.5)';
    g2.beginPath(); g2.moveTo(X(nx), 0); g2.lineTo(X(nx), LH); g2.stroke();
    g2.fillStyle = '#000'; g2.fillRect(X(nx) - 15, 1, 30, 13);
    g2.fillStyle = '#ff6b6b'; g2.fillText(nx.toFixed(3).slice(1), X(nx) - 13, 11);
  }
  for (let ny = Math.ceil(y0 / pasY) * pasY; ny <= y1; ny += pasY) {
    g2.strokeStyle = 'rgba(90,200,255,0.5)';
    g2.beginPath(); g2.moveTo(0, Y(ny)); g2.lineTo(LW, Y(ny)); g2.stroke();
    g2.fillStyle = '#000'; g2.fillRect(1, Y(ny) - 7, 32, 13);
    g2.fillStyle = '#5cc8ff'; g2.fillText(ny.toFixed(3).slice(1), 3, Y(ny) + 4);
  }
  const t = document.createElement('div');
  t.style.cssText = 'color:#e8e6df;font:700 12px ui-monospace;padding:4px 8px';
  t.textContent = `${fichier} · x ${x0.toFixed(3)}→${x1.toFixed(3)} · y ${y0.toFixed(3)}→${y1.toFixed(3)} · ×${zoom}`;
  couche.append(t, c);
  document.body.appendChild(couche);
  window.scrollTo({ top: 0, behavior: 'instant' });
  return { x0, x1, y0, y1 };
}

/** Grille graduée dans le repère de l'image, pour un premier relevé d'ensemble. */
function grille(x0, x1, y0, y1, pas = 0.05) {
  g.clearRect(0, 0, W, H);
  g.lineWidth = 1.4;
  g.font = 'bold 17px monospace';
  for (let x = x0; x <= x1 + 1e-9; x += pas) {
    g.strokeStyle = 'rgba(255,60,60,0.75)';
    g.beginPath(); g.moveTo(x * W, y0 * H); g.lineTo(x * W, y1 * H); g.stroke();
    g.fillStyle = '#000'; g.fillRect(x * W - 22, y0 * H - 20, 44, 19);
    g.fillStyle = '#ff5555'; g.fillText(x.toFixed(2).slice(1), x * W - 19, y0 * H - 5);
  }
  for (let y = y0; y <= y1 + 1e-9; y += pas) {
    g.strokeStyle = 'rgba(90,200,255,0.75)';
    g.beginPath(); g.moveTo(x0 * W, y * H); g.lineTo(x1 * W, y * H); g.stroke();
    g.fillStyle = '#000'; g.fillRect(x0 * W - 46, y * H - 10, 44, 19);
    g.fillStyle = '#5cc8ff'; g.fillText(y.toFixed(2).slice(1), x0 * W - 43, y * H + 5);
  }
  return 'grille';
}

/**
 * Traque un bord sombre verticalement : à chaque ligne, le minimum de
 * luminance dans une fenêtre autour de la position précédente.
 *
 * Sert à vérifier qu'une ligne droite du monde l'est aussi dans l'image. Un
 * arc systématique — écart positif aux deux bouts, négatif au milieu — est la
 * signature d'une **distorsion en barillet**, que le modèle sténopé de
 * SceneData ne sait pas représenter. C'est ce test qui a écarté room-couloir.
 */
function traqueVerticale(xd, yd, yf, fenetre = 4, pas = 5) {
  const d = photo.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const lum = (x, y) => {
    const p = ((y | 0) * W + (x | 0)) * 4;
    return 0.2126 * d[p] + 0.7152 * d[p + 1] + 0.0722 * d[p + 2];
  };
  let x = xd * W;
  const out = [];
  for (let y = yd * H; y <= yf * H; y += pas) {
    let best = x;
    let bv = Infinity;
    for (let dx = -fenetre; dx <= fenetre; dx += 0.5) {
      const v = (lum(x + dx, y - 1) + lum(x + dx, y) + lum(x + dx, y + 1)) / 3;
      if (v < bv) { bv = v; best = x + dx; }
    }
    out.push({ x: best / W, y: y / H });
    x = best;
  }
  return out;
}

/** Écart signé à la droite ajustée, échantillonné : révèle une courbure. */
function courbure(points) {
  const fit = ajusteDroite(points.map((p) => ({ x: p.x * W, y: p.y * H })));
  if (!fit) return null;
  const ecarts = points.map((p) => (p.x * W - fit.p.x) * fit.d.y - (p.y * H - fit.p.y) * fit.d.x);
  const n = ecarts.length;
  const a = (i) => +ecarts[Math.min(n - 1, Math.max(0, i))].toFixed(2);
  return { n, residuMax: fit.residuMax, residuMoyen: fit.residuMoyen, arc: [a(0), a((n / 4) | 0), a((n / 2) | 0), a(((3 * n) / 4) | 0), a(n - 1)] };
}

window.C = {
  photo, W, H, fichier, log, trace, apercu, fermer,
  loupe, grille, traqueVerticale, courbure,
  ligneDuSol, ligneDepuisPoints, fuite, calibre, affine,
  intersecte, ajusteDroite, focaleParOrthogonalite, quadDepuisPiece,
  pointAuSol, mesureQuad, etendueVisible,
  orientationLocale, fuiteDesLames, piedDeMur, releveColonnes,
  surLeCadre,
};
log('prêt — window.C');
</script>
</body>
</html>
